<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orçamento do Casal</title>
<meta name="theme-color" content="#0A0D11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%2338E08B'/%3E%3Cpath d='M128 196a44 44 0 0 1 44-44h132a34 34 0 0 1 34 34v18' fill='none' stroke='%2305140C' stroke-width='30' stroke-linecap='round'/%3E%3Crect x='128' y='196' width='256' height='164' rx='40' fill='none' stroke='%2305140C' stroke-width='30'/%3E%3Ccircle cx='320' cy='278' r='20' fill='%2305140C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=7">
<script>try{var t=localStorage.getItem('orc-tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;
    padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));
    background:var(--bg);color:var(--text);font:var(--fw-reg) 15px/1.5 var(--ff-ui);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(60% 50% at 50% -10%,var(--brand-soft),transparent 70%)}
  .wrap{width:100%;max-width:380px}
  form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:30px 26px 26px;box-shadow:var(--shadow-lg)}
  .brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px}
  .mark{width:54px;height:54px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:var(--glow)}
  .mark svg{width:28px;height:28px}
  h1{font:var(--fw-xbold) var(--fs-h2)/1.2 var(--ff-ui);letter-spacing:var(--ls-snug);margin:0;text-align:center;color:var(--ink)}
  .sub{color:var(--muted);font-size:var(--fs-sm);margin:4px 0 0;text-align:center}
  .hint{color:var(--text);font-size:var(--fs-sm);margin:0 0 6px;text-align:center;line-height:1.45;
    background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:var(--r-md);padding:10px 12px}
  label{display:block;font:var(--fw-sem) var(--fs-micro)/1 var(--ff-ui);letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
  input{width:100%;height:48px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink);
    font:var(--fw-med) 16px/1.2 var(--ff-ui);padding:0 14px;outline:none;transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
  input::placeholder{color:var(--faint)}
  input.pin{letter-spacing:.4em;text-align:center;font-weight:var(--fw-bold)}
  input:focus{border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft)}
  button{width:100%;height:50px;margin-top:22px;border:0;border-radius:var(--r-md);background:var(--brand);color:var(--brand-ink);
    font:var(--fw-bold) var(--fs-lg)/1 var(--ff-ui);cursor:pointer;box-shadow:var(--glow);transition:transform var(--dur-fast) var(--ease),filter var(--dur-fast) var(--ease)}
  button:hover{filter:brightness(1.06)} button:active{transform:scale(.985)}
  button[disabled]{opacity:.6;cursor:default}
  .link{display:block;text-align:center;margin-top:14px;padding:8px;color:var(--brand);font-size:var(--fs-sm);font-weight:var(--fw-sem);text-decoration:none;cursor:pointer}
  .link:hover{color:var(--ink)}
  .tip{color:var(--muted);font-size:var(--fs-cap);line-height:1.45;margin:8px 2px 0} .tip b{color:var(--ink)}
  .err{color:var(--neg);font-weight:var(--fw-sem);font-size:var(--fs-sm);margin-top:14px;text-align:center;
    background:var(--neg-soft);border:1px solid var(--neg-soft);border-radius:var(--r-md);padding:10px 12px}
  .foot{margin-top:18px;text-align:center;color:var(--faint);font-size:var(--fs-cap);display:flex;align-items:center;justify-content:center;gap:6px}
  .foot svg{width:13px;height:13px}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="wrap">
    <form id="f" autocomplete="on">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h12A1.5 1.5 0 0 1 19 7v1.5"/><rect x="3.5" y="7.5" width="17" height="11" rx="2.2"/><circle cx="16.3" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg></div>
        <div><h1 id="title">Bem-vindos de volta</h1><p class="sub" id="sub">Entre pra ver o orçamento do casal</p></div>
      </div>
      <p class="hint" id="reghint" hidden>Primeiro acesso. Crie sua conta e um código que a outra pessoa vai usar pra entrar.</p>

      <div id="nomerow" hidden>
        <label>Seu nome</label>
        <input name="nome" id="nome" type="text" autocomplete="name" autocorrect="off" spellcheck="false" placeholder="Como aparece nos lançamentos">
      </div>

      <label>CPF</label>
      <input name="cpf" id="cpf" type="text" inputmode="numeric" autocomplete="username" maxlength="14" placeholder="000.000.000-00" required>

      <label>PIN</label>
      <input name="pin" id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••" required>

      <div id="codrow" hidden>
        <label id="codlabel">Código do casal</label>
        <input name="codigo" id="codigo" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="segredo do casal">
        <p class="tip">Digite o código <b>exatamente</b> como foi criado — diferencia maiúsculas de minúsculas.</p>
      </div>

      <button type="submit" id="submit">Entrar</button>
      <a class="link" id="toggle">Primeiro acesso? Cadastrar</a>

      <div class="err" id="err" hidden></div>
    </form>
    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Acesso privado · protegido por PIN
    </div>
  </div>

  <script>
  (function(){
    var API='https://pggcbvafkwyqyvlkiyti.supabase.co/functions/v1/orcamento';
    var TOKKEY='orc_token';
    var el=function(id){return document.getElementById(id);};
    var mode='login', firstSetup=false;

    // já logado? vai pro app
    try{ if(localStorage.getItem(TOKKEY)){ location.replace('index.html'); return; } }catch(e){}

    function showErr(m){ el('err').textContent=m||''; el('err').hidden=!m; }
    function apply(){
      var reg=(mode==='register');
      el('nomerow').hidden=!reg; el('codrow').hidden=!reg;
      el('nome').required=reg; el('codigo').required=reg;
      el('reghint').hidden=!(reg&&firstSetup);
      el('codlabel').textContent=firstSetup?'Crie o código do casal':'Código do casal';
      el('title').textContent=reg?'Criar acesso':'Bem-vindos de volta';
      el('sub').textContent=reg?'Configure o acesso de vocês':'Entre pra ver o orçamento do casal';
      el('submit').textContent=reg?'Cadastrar e entrar':'Entrar';
      el('pin').setAttribute('autocomplete',reg?'new-password':'current-password');
      el('toggle').textContent=reg?'Já tenho acesso — Entrar':'Primeiro acesso? Cadastrar';
      el('toggle').style.display=firstSetup?'none':'block';
    }
    function setMode(m){mode=m;showErr('');apply();}
    el('toggle').addEventListener('click',function(){setMode(mode==='register'?'login':'register');});

    setMode('login');
    fetch(API+'/api/status',{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null;})
      .then(function(s){ if(s&&!s.hasUsers){firstSetup=true;setMode('register');} else {firstSetup=false;apply();} })
      .catch(function(){});

    el('f').addEventListener('submit',function(ev){
      ev.preventDefault();
      showErr('');
      var payload={mode:mode,cpf:el('cpf').value,pin:el('pin').value};
      if(mode==='register'){payload.nome=el('nome').value;payload.codigo=el('codigo').value;}
      var btn=el('submit'); btn.disabled=true; var old=btn.textContent; btn.textContent='Entrando…';
      fetch(API+'/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){
          if(x.ok&&x.j&&x.j.token){
            try{localStorage.setItem(TOKKEY,x.j.token);}catch(e){}
            location.replace('index.html');
          }else{
            showErr((x.j&&x.j.error)?x.j.error:'Não deu pra entrar. Tente de novo.');
            btn.disabled=false; btn.textContent=old;
          }
        })
        .catch(function(){ showErr('Falha de conexão. Verifique a internet.'); btn.disabled=false; btn.textContent=old; });
    });

    // máscaras
    el('cpf').addEventListener('input',function(){
      var v=this.value.replace(/\D/g,'').slice(0,11),o=v;
      if(v.length>9)o=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
      else if(v.length>6)o=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
      else if(v.length>3)o=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
      this.value=o;
    });
    el('pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,6);});
  })();
  </script>
</body>
</html>
