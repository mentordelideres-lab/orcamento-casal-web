<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orçamento do Casal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='104' fill='%23D4FF4F'/%3E%3Ctext x='256' y='312' font-family='monospace' font-size='150' font-weight='700' text-anchor='middle' fill='%230B0C0E'%3EM%26I%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} html,body{margin:0}
  :root{--bg:#0A0B0D;--card:#131519;--card2:#171A1F;--ink:#ECEEF1;--mut:#8A8F99;--line:rgba(255,255,255,.09);--acc:#D4FF4F;--neg:#FF7A7A}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;
    padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));
    background:var(--bg);color:var(--ink);font:400 15px/1.5 Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background-image:radial-gradient(60% 50% at 50% -10%,rgba(212,255,79,.10),transparent 70%),radial-gradient(40% 40% at 90% 110%,rgba(110,168,255,.07),transparent 70%)}
  .wrap{width:100%;max-width:380px}
  form{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:22px;padding:30px 28px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.04) inset;position:relative;overflow:hidden}
  form::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.7}
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
  .mark{width:54px;height:54px;border-radius:15px;background:var(--acc);color:#0A0B0D;
    display:grid;place-items:center;font:700 17px/1 "IBM Plex Mono",monospace;box-shadow:0 10px 26px -8px rgba(212,255,79,.6)}
  h1{font-size:1.28rem;font-weight:700;margin:0;text-align:center;letter-spacing:-.01em}
  .sub{color:var(--mut);font-size:.85rem;margin:3px 0 0;text-align:center}
  .hint{color:var(--mut);font-size:.82rem;margin:0 0 6px;text-align:center;line-height:1.45;
    background:rgba(212,255,79,.06);border:1px solid rgba(212,255,79,.14);border-radius:10px;padding:9px 11px}
  label{display:block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
  input{width:100%;background:#0B0C0E;border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font:500 1rem/1.2 Archivo,sans-serif;padding:13px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:#555b64}
  input.pin{letter-spacing:.4em;text-align:center;font-family:"IBM Plex Mono",monospace}
  input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(212,255,79,.18)}
  button{width:100%;margin-top:20px;border:0;border-radius:12px;background:var(--acc);color:#0A0B0D;
    font:700 1rem/1 Archivo,sans-serif;padding:14px;cursor:pointer;transition:transform .08s,filter .15s}
  button:hover{filter:brightness(1.05)} button:active{transform:translateY(1px)}
  button[disabled]{opacity:.6;cursor:default}
  .link{display:block;text-align:center;margin-top:16px;color:var(--acc);font-size:.86rem;font-weight:500;text-decoration:none;cursor:pointer}
  .link:hover{text-decoration:underline}
  .tip{color:var(--mut);font-size:.74rem;line-height:1.4;margin:8px 2px 0} .tip b{color:var(--ink)}
  .err{color:var(--neg);font-weight:600;font-size:.82rem;margin-top:14px;text-align:center;
    background:rgba(255,122,122,.08);border:1px solid rgba(255,122,122,.25);border-radius:10px;padding:9px 11px}
  .foot{margin-top:18px;text-align:center;color:#5c626b;font-size:.72rem;display:flex;align-items:center;justify-content:center;gap:6px}
  .foot svg{width:13px;height:13px;opacity:.8}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="wrap">
    <form id="f" autocomplete="on">
      <div class="brand">
        <div class="mark">M&amp;I</div>
        <div><h1 id="title">Bem-vindos de volta</h1><p class="sub" id="sub">Entre pra ver o orçamento do casal</p></div>
      </div>
      <p class="hint" id="reghint" hidden>Primeiro acesso. Crie sua conta e um código que a outra pessoa vai usar pra entrar.</p>

      <div id="nomerow" hidden>
        <label>Seu nome</label>
        <input name="nome" id="nome" type="text" autocomplete="name" autocorrect="off" spellcheck="false" placeholder="Como aparece nos lançamentos">
      </div>

      <label>CPF</label>
      <input name="cpf" id="cpf" type="text" inputmode="numeric" autocomplete="username" maxlength="14" placeholder="000.000.000-00" required>

      <label>PIN</label>
      <input name="pin" id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••" required>

      <div id="codrow" hidden>
        <label id="codlabel">Código do casal</label>
        <input name="codigo" id="codigo" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="segredo do casal">
        <p class="tip">Digite o código <b>exatamente</b> como foi criado — diferencia maiúsculas de minúsculas.</p>
      </div>

      <button type="submit" id="submit">Entrar</button>
      <a class="link" id="toggle">Primeiro acesso? Cadastrar</a>

      <div class="err" id="err" hidden></div>
    </form>
    <div class="foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Acesso privado · protegido por PIN
    </div>
  </div>

  <script>
  (function(){
    var API='https://pggcbvafkwyqyvlkiyti.supabase.co/functions/v1/orcamento';
    var TOKKEY='orc_token';
    var el=function(id){return document.getElementById(id);};
    var mode='login', firstSetup=false;

    // já logado? vai pro app
    try{ if(localStorage.getItem(TOKKEY)){ location.replace('index.html'); return; } }catch(e){}

    function showErr(m){ el('err').textContent=m||''; el('err').hidden=!m; }
    function apply(){
      var reg=(mode==='register');
      el('nomerow').hidden=!reg; el('codrow').hidden=!reg;
      el('nome').required=reg; el('codigo').required=reg;
      el('reghint').hidden=!(reg&&firstSetup);
      el('codlabel').textContent=firstSetup?'Crie o código do casal':'Código do casal';
      el('title').textContent=reg?'Criar acesso':'Bem-vindos de volta';
      el('sub').textContent=reg?'Configure o acesso de vocês':'Entre pra ver o orçamento do casal';
      el('submit').textContent=reg?'Cadastrar e entrar':'Entrar';
      el('pin').setAttribute('autocomplete',reg?'new-password':'current-password');
      el('toggle').textContent=reg?'Já tenho acesso — Entrar':'Primeiro acesso? Cadastrar';
      el('toggle').style.display=firstSetup?'none':'block';
    }
    function setMode(m){mode=m;showErr('');apply();}
    el('toggle').addEventListener('click',function(){setMode(mode==='register'?'login':'register');});

    setMode('login');
    fetch(API+'/api/status',{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null;})
      .then(function(s){ if(s&&!s.hasUsers){firstSetup=true;setMode('register');} else {firstSetup=false;apply();} })
      .catch(function(){});

    el('f').addEventListener('submit',function(ev){
      ev.preventDefault();
      showErr('');
      var payload={mode:mode,cpf:el('cpf').value,pin:el('pin').value};
      if(mode==='register'){payload.nome=el('nome').value;payload.codigo=el('codigo').value;}
      var btn=el('submit'); btn.disabled=true; var old=btn.textContent; btn.textContent='Entrando…';
      fetch(API+'/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){
          if(x.ok&&x.j&&x.j.token){
            try{localStorage.setItem(TOKKEY,x.j.token);}catch(e){}
            location.replace('index.html');
          }else{
            showErr((x.j&&x.j.error)?x.j.error:'Não deu pra entrar. Tente de novo.');
            btn.disabled=false; btn.textContent=old;
          }
        })
        .catch(function(){ showErr('Falha de conexão. Verifique a internet.'); btn.disabled=false; btn.textContent=old; });
    });

    // máscaras
    el('cpf').addEventListener('input',function(){
      var v=this.value.replace(/\D/g,'').slice(0,11),o=v;
      if(v.length>9)o=v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
      else if(v.length>6)o=v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
      else if(v.length>3)o=v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
      this.value=o;
    });
    el('pin').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,6);});
  })();
  </script>
</body>
</html>
