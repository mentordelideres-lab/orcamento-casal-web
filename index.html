<script>
/* ===================== budget-core (estendido) ===================== */
(function () {
  'use strict';
  var MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var MONTHS_ABBR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var PEOPLE={M:{code:'M',name:'Matheus'},I:{code:'I',name:'Isabella'},C:{code:'C',name:'Conjunto'}};
  window.API_ROOT='https://pggcbvafkwyqyvlkiyti.supabase.co/functions/v1/orcamento';
  window.BASE=window.API_ROOT;
  window.LOGIN_URL='login.html';
  window.TOKKEY='orc_token';
  window.getTok=function(){try{return localStorage.getItem('orc_token')||'';}catch(e){return '';}};
  window.afetch=function(u,o){o=o||{};var h={};if(o.headers){for(var k in o.headers)h[k]=o.headers[k];}var t=window.getTok();if(t)h['x-orc-token']=t;o.headers=h;return fetch(u,o);};
  window.orcLogout=function(){var t=window.getTok();try{localStorage.removeItem('orc_token');}catch(e){}try{fetch(window.API_ROOT+'/api/logout',{method:'POST',headers:t?{'x-orc-token':t}:{}});}catch(e){}location.replace('login.html');};
  var STORAGE_KEY='orcamento-casal-v1', API=BASE+'/api/budget';
  function pad(n){return String(n).padStart(2,'0');}
  function keyOf(y,m){return y+'-'+pad(m);}
  function shiftMonth(y,m,d){var i=(y*12+(m-1))+d;return {y:Math.floor(i/12),m:(i%12)+1};}
  function monthLabel(y,m){return MONTHS[m-1]+' '+y;}
  function monthAbbr(y,m){return MONTHS_ABBR[m-1];}
  function brl(v,o){var cents=!o||o.cents!==false;var n=Math.abs(Number(v)||0);
    var s=n.toLocaleString('pt-BR',{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0});
    return (v<0?'-R$ ':'R$ ')+s;}
  // separa sinal, moeda e número (o hero mostra o R$ menor que o valor)
  function brlParts(v,o){var cents=!o||o.cents!==false;var n=Math.abs(Number(v)||0);
    return {sign:v<0?'−':'',cur:'R$',val:n.toLocaleString('pt-BR',{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0})};}
  function pctText(v){return (Math.round(v*10)/10).toLocaleString('pt-BR')+'%';}
  function parseMoney(raw){var t=String(raw==null?'':raw).trim().replace(/[^0-9.,-]/g,'');
    if(!t)return NaN; if(t.indexOf(',')>-1)return Number(t.replace(/\./g,'').replace(',','.'));
    if((t.match(/\./g)||[]).length>1)return Number(t.replace(/\./g,'')); return Number(t);}
  function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  var RULES=[
    [/cart[ãa]o|visa|amex|master|nubank|\bc6\b|elo\b/i,'Cartões','card'],
    [/luz|energia|enel|cemig|light/i,'Moradia','bolt'],
    [/[áa]gua|saneam|sabesp|cagece/i,'Moradia','drop'],
    [/aluguel|condom[íi]nio|im[óo]vel|reforma|apartamento|\bapto\b|\bap\b|financiamento|financ\.|presta[çc][ãa]o do ap/i,'Moradia','home'],
    [/net|vivo|claro|\btim\b|internet|telefone|celular|streaming|netflix|spotify|apple\.com|disney|hbo|max\b/i,'Assinaturas','wifi'],
    [/imposto|iptu|ipva|\bdas\b|tribut|inss|simples/i,'Impostos','receipt'],
    [/combust[íi]vel|gasolina|posto|\buber|\b99\b|99\s?ride|99\s?food|carro|veloe|ped[áa]gio|pedagio|rodoanel|estacion|cloudpark|park/i,'Transporte','car'],
    [/mercado|aliment|feira|restaurante|ifood|ifd|padaria|pao de acucar|pão de açúcar|dia brasil|carrefour|churrasc|pizz|burger|lanch|comida|keeta|cacau|gourmet|food/i,'Alimentação','cart'],
    [/escola|faculdade|curso|especializa|mentoria|livro|treinamento/i,'Educação','book'],
    [/plano de sa[úu]de|m[ée]dico|farm[áa]cia|dental|dentista|academia|terapia|drogasil|droga|raia/i,'Saúde','heart'],
    [/d[íi]zimo|oferta|doa[çc][ãa]o|igreja/i,'Doação','hands'],
    [/contador|advogado|consultoria|assessoria|ag[êe]ncia|hotel|villa/i,'Serviços','briefcase'],
    [/adidas|nike|modas|cea |cosmetic|onnix|loja|shopping|store|zerezes/i,'Compras','bag'],
    [/sal[áa]rio|pr[óo]-?labore|renda|recebimento|comiss|dividendo/i,'Renda','wallet']
  ];
  function classify(desc,group){for(var i=0;i<RULES.length;i++){if(RULES[i][0].test(desc))return {cat:RULES[i][1],icon:RULES[i][2]};}
    return group==='pj'?{cat:'Serviços',icon:'briefcase'}:{cat:'Outros',icon:'tag'};}

  function loadLocal(){try{var raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;var d=JSON.parse(raw);if(d&&d.entries)return d;}catch(e){}return null;}
  function saveLocal(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(e){}return s;}
  function loadRemote(){if(typeof fetch!=='function')return Promise.resolve(null);
    return afetch(API,{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null;})
      .then(function(d){return d&&d.entries?d:null;}).catch(function(){return null;});}
  function saveRemote(s){if(typeof fetch!=='function')return Promise.resolve(false);
    return afetch(API,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(s)})
      .then(function(r){return r.ok;}).catch(function(){return false;});}

  function buildEntries(form,y,m){
    var amount=parseMoney(form.value);var desc=String(form.desc||'').trim();
    if(!desc||!isFinite(amount)||amount<=0)return null;
    var day=Math.min(31,Math.max(0,parseInt(form.day,10)||0));
    var times = form.repeat==='parcelado'?Math.max(2,Math.min(60,parseInt(form.parcels,10)||2))
      : form.repeat==='fixo'?Math.max(1,Math.min(60,parseInt(form.months,10)||3)) : 1;
    var each = form.repeat==='parcelado'?amount/times:amount;
    var group=form.kind==='in'?'in':(form.group||'casa');
    var c=(form.cat&&String(form.cat).trim())?{cat:String(form.cat).trim(),icon:classify(desc,group).icon}:classify(desc,group);
    var out=[];
    for(var i=0;i<times;i++){var at=shiftMonth(y,m,i);
      out.push({key:keyOf(at.y,at.m),entry:{
        id:uid(),
        name: form.repeat==='parcelado'?desc+' ('+(i+1)+'/'+times+')':desc,
        kind:form.kind==='in'?'in':'out', amount:Math.round(each*100)/100, day:day,
        owner:form.owner||'C', group:group, cat:c.cat, icon:c.icon, paid:false,
        method:String(form.method||'').trim(), repeat:form.repeat||'none', fixo:!!form.fixo,
        parcel: form.repeat==='parcelado'?{n:i+1,total:times}:null
      }});}
    return out;
  }
  function withEntries(store,built){var e=Object.assign({},store.entries);
    built.forEach(function(b){e[b.key]=(e[b.key]||[]).concat([b.entry]);});return Object.assign({},store,{entries:e});}
  function mapMonth(store,key,fn){var e=Object.assign({},store.entries);e[key]=fn((e[key]||[]).slice());return Object.assign({},store,{entries:e});}
  function togglePaid(store,key,id){return mapMonth(store,key,function(l){return l.map(function(e){return e.id===id?Object.assign({},e,{paid:!e.paid}):e;});});}
  function updateEntry(store,key,id,patch){return mapMonth(store,key,function(l){return l.map(function(e){return e.id===id?Object.assign({},e,patch):e;});});}
  function removeEntry(store,key,id){return mapMonth(store,key,function(l){return l.filter(function(e){return e.id!==id;});});}
  function copyMonth(store,from,to){var src=store.entries[from]||[];
    var clone=src.filter(function(e){return !e.parcel;}).map(function(e){return Object.assign({},e,{id:uid(),paid:false});});
    var e=Object.assign({},store.entries);e[to]=(e[to]||[]).concat(clone);return Object.assign({},store,{entries:e});}
  function setGoal(store,cat,limit){var g=Object.assign({},store.goals||{});if(!isFinite(limit)||limit<=0)delete g[cat];else g[cat]=limit;return Object.assign({},store,{goals:g});}
  var BASE_CATS=['Alimentação','Transporte','Moradia','Cartões','Assinaturas','Impostos','Educação','Saúde','Serviços','Compras','Doação','Outros'];
  function categoriesInUse(store){var set={};BASE_CATS.forEach(function(c){set[c]=1;});
    Object.keys(store.entries||{}).forEach(function(k){(store.entries[k]||[]).forEach(function(e){if(e.kind==='out'&&e.cat)set[e.cat]=1;});});
    Object.keys(store.goals||{}).forEach(function(c){set[c]=1;});return Object.keys(set).sort();}
  function setObjective(store,obj){var list=(store.objectives||[]).slice(),i=-1;
    for(var j=0;j<list.length;j++)if(list[j].id===obj.id)i=j;
    if(i>=0)list[i]=Object.assign({},list[i],obj);else list.push(obj);return Object.assign({},store,{objectives:list});}
  function removeObjective(store,id){return Object.assign({},store,{objectives:(store.objectives||[]).filter(function(o){return o.id!==id;})});}
  function addContribution(store,id,amount){var list=(store.objectives||[]).map(function(o){return o.id===id?Object.assign({},o,{saved:Math.round(((+o.saved||0)+amount)*100)/100}):o;});return Object.assign({},store,{objectives:list});}
  function clearMonth(store,key){var e=Object.assign({},store.entries);delete e[key];return Object.assign({},store,{entries:e});}

  // fração da renda da casa de cada pessoa (pote comum: rateio proporcional à renda)
  function incomeFrac(list,who){var inM=0,inI=0;
    list.forEach(function(e){if(e.kind==='in'){if(e.owner==='M')inM+=e.amount;else if(e.owner==='I')inI+=e.amount;}});
    var base=inM+inI;if(base<=0)return 0.5;return who==='M'?inM/base:inI/base;}
  function aggItems(items,extra){
    var income=0,expense=0,paid=0,ic=0,ec=0,oc=0;
    items.forEach(function(e){if(e.kind==='in'){income+=e.amount;ic++;}else{expense+=e.amount;ec++;if(e.paid)paid+=e.amount;else oc++;}});
    var o={items:items,income:income,expense:expense,balance:income-expense,paid:paid,open:expense-paid,
      incomeCount:ic,expenseCount:ec,openCount:oc,
      usedPct:income>0?(expense/income)*100:(expense>0?100:0),
      paidPct:expense>0?(paid/expense)*100:0, leftPct:income>0?((income-expense)/income)*100:0};
    if(extra)for(var k in extra)o[k]=extra[k];return o;}
  function summarize(list,owner){
    // cada pessoa vê só o que é dela; Conjunto só o compartilhado; Geral tudo
    var sel=owner&&owner!=='all'?list.filter(function(e){return e.owner===owner;}):list.slice();
    return aggItems(sel,{mode:owner==='all'?'all':(owner==='C'?'shared':'person')});
  }
  // distribuição da renda da casa entre o casal (quanto cada um recebe, em % proporcional)
  function incomeSplit(list){var m=0,i=0,c=0;
    list.forEach(function(e){if(e.kind==='in'){if(e.owner==='M')m+=e.amount;else if(e.owner==='I')i+=e.amount;else c+=e.amount;}});
    var base=m+i;return {M:m,I:i,C:c,total:m+i+c,fracM:base>0?m/base:0.5,fracI:base>0?i/base:0.5,base:base};}
  function byCategory(sum,pal){var map={},own={};sum.items.forEach(function(e){if(e.kind!=='out')return;map[e.cat]=(map[e.cat]||0)+e.amount;
      var o=own[e.cat]||(own[e.cat]={M:0,I:0,C:0});o[e.owner]=(o[e.owner]||0)+e.amount;});
    var rows=Object.keys(map).map(function(k){return {name:k,amount:map[k],own:own[k]};});rows.sort(function(a,b){return b.amount-a.amount;});
    var max=rows.length?rows[0].amount:1;
    return rows.map(function(r,i){var o=r.own||{M:0,I:0,C:0};var tot=r.amount||1;
      var split=['M','I','C'].map(function(k){var v=o[k]||0;return {code:k,name:PEOPLE[k].name,amount:v,amountText:brl(v),frac:v/tot,pct:Math.round(v/tot*100)};});
      return {name:r.name,amount:r.amount,amountText:brl(r.amount),
      shareText:pctText(sum.expense>0?(r.amount/sum.expense)*100:0),pct:Math.round((r.amount/max)*100),color:pal[i%pal.length],split:split};});}
  function byPerson(sum,colors){var t={M:0,I:0,C:0};sum.items.forEach(function(e){if(e.kind==='out')t[e.owner]=(t[e.owner]||0)+e.amount;});
    var all=t.M+t.I+t.C;return ['M','I','C'].map(function(k){var v=t[k]||0;return {code:k,name:PEOPLE[k].name,amount:v,amountText:brl(v),
      pct:all>0?Math.round((v/all)*100):0,pctText:pctText(all>0?(v/all)*100:0),color:colors[k]};});}
  // fixo/variável: respeita marcação manual (e.fixo true/false); senão deduz de conta recorrente
  function isFixed(e){return e.fixo===true?true:(e.fixo===false?false:(!!e.recId||e.repeat==='fixo'));}
  function fixedVariable(sum){
    var fx=0,vr=0,fc=0,vc=0;
    sum.items.forEach(function(e){if(e.kind!=='out')return;var isFix=isFixed(e);
      if(isFix){fx+=e.amount;fc++;}else{vr+=e.amount;vc++;}});
    var tot=fx+vr;
    return {fixed:fx,variable:vr,fixedCount:fc,variableCount:vc,total:tot,
      fixedText:brl(fx),variableText:brl(vr),
      fixedPct:tot>0?Math.round(fx/tot*100):0,variablePct:tot>0?Math.round(vr/tot*100):0,
      fixedShare:tot>0?pctText(fx/tot*100):'0%',variableShare:tot>0?pctText(vr/tot*100):'0%'};}
  function upcoming(sum,limit){return sum.items.filter(function(e){return e.kind==='out'&&!e.paid;})
    .sort(function(a,b){return (a.day||99)-(b.day||99);}).slice(0,limit||6)
    .map(function(e){return {id:e.id,name:e.name,amountText:brl(e.amount),dayText:e.day?pad(e.day):'—'};});}
  function series(store,y,m,n,owner){var all=[];for(var i=n-1;i>=0;i--){var at=shiftMonth(y,m,-i);
    var s=summarize(store.entries[keyOf(at.y,at.m)]||[],owner);
    all.push({y:at.y,m:at.m,label:monthAbbr(at.y,at.m),full:monthLabel(at.y,at.m),income:s.income,expense:s.expense,isCurrent:i===0});}
    // só meses com movimento (mais o atual) — não enche de meses vazios anteriores
    var out=all.filter(function(r){return r.isCurrent||r.income>0||r.expense>0;});
    if(!out.length)out=[all[all.length-1]];
    var max=out.reduce(function(a,r){return Math.max(a,r.income,r.expense);},1);
    var avg=out.reduce(function(a,r){return a+r.expense;},0)/(out.length||1);
    var prev=out.length>1?out[out.length-2]:null,cur=out[out.length-1];
    return {rows:out.map(function(r){return Object.assign({},r,{incomePct:Math.round((r.income/max)*100),expensePct:Math.round((r.expense/max)*100),expenseText:brl(r.expense,{cents:false}),incomeText:brl(r.income,{cents:false})});}),
      avg:avg,avgText:brl(avg),deltaPct:prev&&prev.expense>0?((cur.expense-prev.expense)/prev.expense)*100:0,prevLabel:prev?prev.full:'—'};}
  function goalRows(store,sum){var goals=store.goals||{},spent={};
    sum.items.forEach(function(e){if(e.kind==='out')spent[e.cat]=(spent[e.cat]||0)+e.amount;});
    return Object.keys(goals).map(function(cat){var limit=goals[cat],used=spent[cat]||0,pct=limit>0?(used/limit)*100:0;
      return {cat:cat,limit:limit,limitText:brl(limit,{cents:false}),used:used,usedText:brl(used),
        leftText:brl(Math.abs(limit-used)),over:used>limit,pct:pct,pctText:pctText(pct),bar:Math.min(100,Math.round(pct))};})
      .sort(function(a,b){return b.pct-a.pct;});}
  function verdict(sum){if(sum.income===0&&sum.expense===0)return {tone:'neutral',title:'Mês em branco',text:'Nenhum lançamento neste recorte.'};
    if(sum.balance<0)return {tone:'danger',title:'No vermelho',text:'Gastos acima da renda — faltam '+brl(Math.abs(sum.balance))+' pra fechar o mês.'};
    if(sum.leftPct<10)return {tone:'warn',title:'Margem apertada',text:'Sobra '+brl(sum.balance)+', menos de 10% da renda.'};
    return {tone:'good',title:'Mês equilibrado',text:'Sobra '+brl(sum.balance)+' de '+brl(sum.income)+' que entraram.'};}

  /* ---------- contas fixas (recorrentes) ---------- */
  function addRecurring(store,tpl){var list=(store.recurring||[]).slice();list.push(tpl);return Object.assign({},store,{recurring:list});}
  function removeRecurring(store,id){return Object.assign({},store,{recurring:(store.recurring||[]).filter(function(r){return r.id!==id;})});}
  function pendingRecurring(store,key){var recs=store.recurring||[];var month=store.entries[key]||[];
    var have={};month.forEach(function(e){if(e.recId)have[e.recId]=1;});
    return recs.filter(function(r){return (!r.since||r.since<=key)&&!have[r.id];});}
  function applyRecurring(store,key,canWrite){
    var pend=pendingRecurring(store,key).filter(function(r){return canWrite?canWrite(r.owner):true;});
    if(!pend.length)return {store:store,added:0};
    var e=Object.assign({},store.entries);var list=(e[key]||[]).slice();
    pend.forEach(function(r){list.push({id:uid(),recId:r.id,name:r.name,kind:r.kind||'out',amount:r.amount,day:r.day||0,
      owner:r.owner||'C',group:r.group||(r.kind==='in'?'in':'casa'),cat:r.cat,icon:r.icon,paid:false,method:r.method||'',repeat:'fixo',parcel:null});});
    e[key]=list;return {store:Object.assign({},store,{entries:e}),added:pend.length};}

  /* ---------- reserva de emergência ---------- */
  function addReserve(store,amount){var cur=+store.reserve||0;return Object.assign({},store,{reserve:Math.round((cur+amount)*100)/100});}

  /* ---------- comparativo com o mês anterior ---------- */
  function categoryDeltas(store,y,m,owner){
    function catmap(key){var mp={};(store.entries[key]||[]).forEach(function(e){if(e.kind!=='out')return;if(owner&&owner!=='all'&&e.owner!==owner)return;mp[e.cat]=(mp[e.cat]||0)+e.amount;});return mp;}
    var p=shiftMonth(y,m,-1);var a=catmap(keyOf(y,m)),b=catmap(keyOf(p.y,p.m));
    var keys={};Object.keys(a).forEach(function(k){keys[k]=1;});Object.keys(b).forEach(function(k){keys[k]=1;});
    var rows=Object.keys(keys).map(function(k){var cur=a[k]||0,was=b[k]||0,diff=cur-was;
      return {cat:k,now:cur,was:was,diff:diff,pct:was>0?(diff/was)*100:(cur>0?100:0),abs:Math.abs(diff),
        diffText:(diff>=0?'+':'−')+brl(Math.abs(diff),{cents:false}).replace('R$ ','R$ ')};});
    rows=rows.filter(function(r){return r.abs>=1;}).sort(function(x,z){return z.abs-x.abs;});
    return {rows:rows,prevLabel:monthLabel(p.y,p.m)};}

  /* ---------- previsão de fechamento ---------- */
  function forecast(store,y,m,owner){
    var sum=summarize(store.entries[keyOf(y,m)]||[],owner);
    var hist=[];for(var i=1;i<=6;i++){var at=shiftMonth(y,m,-i);var s=summarize(store.entries[keyOf(at.y,at.m)]||[],owner);if(s.expense>0)hist.push(s.expense);}
    var avg=hist.length?hist.reduce(function(a,b){return a+b;},0)/hist.length:0;
    var projExpense=Math.max(sum.expense,avg);var projBalance=sum.income-projExpense;
    return {income:sum.income,expense:sum.expense,avg:avg,avgText:brl(avg,{cents:false}),
      projExpense:projExpense,projBalance:projBalance,projText:brl(projBalance),hasHist:hist.length>0,
      aboveAvg:avg>0&&sum.expense>avg};}

  /* ---------- exportar CSV (Excel pt-BR: ; e vírgula decimal) ---------- */
  function toCSV(store,key){
    var head=['Mes','Dia','Descricao','Tipo','Grupo','Categoria','Quem','Forma','Valor','Pago'];
    var out=[head];var keys=key?[key]:Object.keys(store.entries||{}).sort();
    keys.forEach(function(k){(store.entries[k]||[]).forEach(function(e){

  /* ---------- importador de PDF (Bradesco) ---------- */
  function openImport(){S.imp={rows:[],card:'',month:keyNow(),busy:false,group:true};openSheet('import');}
  async function handlePdf(file){
    if(!file)return; if(!window.pdfjsLib){toast('Leitor de PDF não carregou');return;}
    S.imp.busy=true;renderSheet();
    try{
      var buf=await file.arrayBuffer();
      var pdf=await pdfjsLib.getDocument({data:buf}).promise;
      var lines=[];
      for(var p=1;p<=pdf.numPages;p++){
        var page=await pdf.getPage(p);var tc=await page.getTextContent();
        var rows={};
        tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str});});
        Object.keys(rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
          var line=rows[y].sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(' ').replace(/\s+/g,' ').trim();
          if(line)lines.push(line);
        });
      }
      var parsed=parseBradesco(lines);
      if(!parsed.rows.length){toast('Não encontrei lançamentos nesse PDF');S.imp.busy=false;renderSheet();return;}
      S.imp.rows=parsed.rows;S.imp.card=parsed.card||'';S.imp.busy=false;renderSheet();
    }catch(e){console.error(e);toast('Não consegui ler o PDF (pode ser imagem/escaneado)');S.imp.busy=false;renderSheet();}
  }
  function parseBradesco(lines){
    var owner='C',card='',day=0,prog=false,rows=[];
    var full=lines.join(' ').toUpperCase();
    if(full.indexOf('AMERICAN EXPRESS')>-1)card='Amex'; else if(full.indexOf('VISA')>-1)card='Visa';
    var MESES='JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ';
    for(var i=0;i<lines.length;i++){
      var ln=lines[i];
      if(/Lan[çc]amentos programados/i.test(ln)){prog=true;continue;}
      var mc=ln.match(/Final\s+\d+\s*\|\s*(.+)/i);
      if(mc){prog=false;var nm=mc[1].toUpperCase();owner=nm.indexOf('ISABELLA')>-1?'I':(nm.indexOf('MATHEUS')>-1?'M':'C');continue;}
      var md=ln.match(new RegExp('^(\\d{1,2})\\s+('+MESES+')$','i'));
      if(md){day=+md[1];continue;}
      if(/^\d{1,2}$/.test(ln)&&i+1<lines.length&&new RegExp('^('+MESES+')$','i').test(lines[i+1])){day=+ln;i++;continue;}
      if(prog)continue;
      var mt=ln.match(/^(.+?)\s+(-?[\d.]+,\d{2})$/);
      if(mt){
        var desc=mt[1].trim();var val=parseFloat(mt[2].replace(/\./g,'').replace(',','.'));
        if(!isFinite(val)||val<=0)continue;
        if(/SALDO ANTERIOR|PAGTO|PAGAMENTO|^Total|Valor da fatura|Despesas|Resumo|Taxas|M[íi]nimo|Cota[çc][ãa]o|Validade|Vencimento/i.test(desc))continue;
        var parcel=null;var mp=desc.match(/\(\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)/);
        if(mp){parcel={n:+mp[1],total:+mp[2]};desc=desc.replace(mp[0],'').trim();}
        rows.push({day:day,desc:desc,amount:Math.round(val*100)/100,owner:owner,parcel:parcel,include:true});
      }
    }
    return {rows:rows,card:card};
  }
  function doImport(){
    var rows=S.imp.rows.filter(function(r){return r.include;});
    if(!rows.length){toast('Nada selecionado');return;}
    if(!isAdmin()){var mp=myPerson();rows.forEach(function(r){r.owner=mp;});}
    var month=S.imp.month||keyNow();var card=(S.imp.card||'Cartão').trim()||'Cartão';
    var built;S.sheet=null;
    if(S.imp.group){
      // 1 lançamento por cartão (por pessoa, pois a fatura separa por titular)
      var byOwner={};rows.forEach(function(r){(byOwner[r.owner||'C']=byOwner[r.owner||'C']||[]).push(r);});
      var owners=Object.keys(byOwner);var multi=owners.length>1;

  function objView(o,leftover){
    var target=+o.target||0,saved=+o.saved||0,monthly=+o.monthly||0;
    var faltam=Math.max(0,target-saved);var pct=target>0?Math.min(100,Math.round(saved/target*100)):0;
    var done=target>0&&saved>=target;var meses=monthly>0?Math.ceil(faltam/monthly):null;
    var mesesPrazo=null,atrasado=false;
    if(o.deadline&&/^\d{4}-\d{2}$/.test(o.deadline)){var p=o.deadline.split('-');var dl=(+p[0])*12+((+p[1])-1);var cur=S.y*12+(S.m-1);mesesPrazo=Math.max(0,dl-cur);if(!done&&meses!=null&&meses>mesesPrazo)atrasado=true;}
    return {target:target,saved:saved,monthly:monthly,faltam:faltam,pct:pct,done:done,meses:meses,mesesPrazo:mesesPrazo,atrasado:atrasado,cobre:leftover>=monthly};
  }

      metric('A pagar',C.brl(sum.open,{cents:false}),sum.openCount+(sum.openCount===1?' conta aberta':' contas abertas'),v('--warn'))+

  /* ================= tela: EXTRATO ================= */
  function screenExtrato(){

        '<div class="btnrow" style="justify-content:center"><button class="btn btn-primary" data-act="open-new">'+I.plus+'Novo lançamento</button>'+
        (sum.items.length?'':'<button class="btn btn-soft" data-act="copyprev">'+I.copy+'Copiar de '+esc(prevName)+'</button>')+'</div></div>';
    }else{
      h+='<section class="card"><div class="txns">'+dk.map(function(d){

  /* ================= render ================= */
  var lastSheet=null;
  function sheetHtml(){
    switch(S.sheet){
      case 'novo':return sheetNovo(); case 'txn':return sheetTxn(); case 'teto':return sheetTeto();
      case 'obj':return sheetObj(); case 'valor':return sheetValor(); case 'import':return sheetImport();
      case 'mais':return sheetMais(); default:return '';
    }
  }
  function renderSheet(){
    var root=document.getElementById('sheetroot');var html=S.sheet?sheetHtml():'';
    if(!html){root.innerHTML='';lastSheet=null;document.body.style.overflow='';return;}
    var old=root.querySelector('.sheet');var top=old?old.scrollTop:0;var same=lastSheet===S.sheet&&!!old;
    root.innerHTML=html;
    if(same){var sc=root.querySelector('.scrim');if(sc)sc.classList.add('still');var ns=root.querySelector('.sheet');if(ns)ns.scrollTop=top;}
    else{var af=root.querySelector('[autofocus]');if(af)setTimeout(function(){try{af.focus();}catch(e){}},60);}
    lastSheet=S.sheet;document.body.style.overflow='hidden';
  }
  function render(){
    var body;
    switch(S.screen){
      case 'extrato':body=screenExtrato();break; case 'envelopes':body=screenEnvelopes();break;
      case 'metas':body=screenMetas();break; case 'casal':body=screenCasal();break;
      case 'relatorios':body=screenRelatorios();break; case 'ajustes':body=screenAjustes();break;
      default:body=screenInicio();
    }
    var showPeople=S.screen==='inicio'||S.screen==='envelopes';
    document.getElementById('app').innerHTML='<div class="app">'+rail()+
      '<div class="main"><div class="wrap">'+topbar()+(showPeople?peopleFilter():'')+body+'</div></div></div>'+tabbar();
    renderSheet();hideTip();
    try{localStorage.setItem('orc-tela',S.screen);}catch(e){}
  }

  /* ================= eventos ================= */
  function entryOf(key,id){return (S.store.entries[key]||[]).filter(function(x){return x.id===id;})[0];}
  function onClick(ev){
    var t=ev.target;var el=t.closest?t.closest('[data-act]'):null;
    if(!el){var tp=t.closest?t.closest('[data-tip]'):null;if(tp){var r=tp.getBoundingClientRect();showTip(tp.getAttribute('data-tip'),r.left+r.width/2,r.top);clearTimeout(showTip._t);showTip._t=setTimeout(hideTip,2500);}return;}
    var a=el.getAttribute('data-act'),val=el.getAttribute('data-v');
    var k=el.getAttribute('data-key'),id=el.getAttribute('data-id');
    if(a==='close-sheet'&&el.classList.contains('scrim')&&t!==el)return; // clique dentro do sheet não fecha
    switch(a){
      case 'nav':S.sheet=null;go(val);render();break;
      case 'more':openSheet('mais');break;
      case 'owner':S.owner=val;S.catSel=null;S.envSel=null;S.fvSel=null;render();break;
      case 'prevm':shift(-1);break; case 'nextm':shift(1);break;
      case 'theme':S.theme=val||(S.theme==='dark'?'light':'dark');try{localStorage.setItem('orc-tema',S.theme);}catch(e){}applyTheme();render();break;
      case 'logout':orcLogout();break;
      case 'catpick':S.catSel=S.catSel===val?null:val;render();break;
      case 'envdetail':S.envSel=val;go('envelopes');render();break;
      case 'envpick':S.envSel=S.envSel===val?null:val;render();break;
      case 'fvpick':S.fvSel=S.fvSel===val?null:val;render();break;
      case 'status':S.filter.status=val;render();break;
      case 'see-open':S.filter.status='abertos';go('extrato');render();break;
      case 'open-new':openNew();break;
      case 'close-sheet':closeSheet();break;
      case 'f-kind':S.form.kind=val;renderSheet();break;
      case 'f-owner':S.form.owner=val;renderSheet();break;
      case 'f-group':S.form.group=val;renderSheet();break;
      case 'f-fixo':S.form.fixo=val==='1';renderSheet();break;
      case 'f-repeat':S.form.repeat=val;if(val==='fixo')S.form.fixo=true;renderSheet();break;
      case 'f-cat':if(val==='__new__'){S.form.catNew=true;if(C.categoriesInUse(S.store).indexOf(S.form.cat)>-1)S.form.cat='';}else{S.form.catNew=false;S.form.cat=val;}renderSheet();
        if(val==='__new__'){var cn=document.querySelector('[data-field="catnew"]');if(cn)cn.focus();}break;
      case 'key':keyPress(val);break;
      case 'save':submitForm();break;
      case 'txn':S.txnSel={key:k,id:id};openSheet('txn');break;
      case 'toggle':{var te=entryOf(k,id);commit(C.togglePaid(S.store,k,id));if(te)toast(te.kind==='in'?(te.paid?'Marcado como previsto':'Marcado como recebido'):(te.paid?'Reaberto':'Marcado como pago'));break;}
      case 'edit':startEdit(k,id);break;
      case 'togglefix':{var fe=entryOf(k,id);if(fe){var nf=!C.isFixed(fe);commit(C.updateEntry(S.store,k,id,{fixo:nf}));toast(nf?'Marcado como fixo':'Marcado como variável');}break;}
      case 'remove':{var re=entryOf(k,id);if(!re)break;if(!window.confirm('Excluir "'+re.name+'" ('+C.brl(re.amount)+')?'))break;S.sheet=null;S.txnSel=null;commit(C.removeEntry(S.store,k,id));toast('Excluído');break;}
      case 'rmitem':removeItem(k,id,+el.getAttribute('data-idx'));break;
      case 'copyprev':{var p=C.shiftMonth(S.y,S.m,-1);var src=(S.store.entries[C.keyOf(p.y,p.m)]||[]).filter(function(e){return !e.parcel;});
        if(!src.length){toast('Não há lançamentos em '+C.monthLabel(p.y,p.m));break;}
        if(!window.confirm('Copiar '+src.length+' lançamento'+(src.length>1?'s':'')+' de '+C.monthLabel(p.y,p.m)+' para '+C.monthLabel(S.y,S.m)+'? (parcelas não são copiadas)'))break;
        commit(C.copyMonth(S.store,C.keyOf(p.y,p.m),keyNow()));toast('Copiado');break;}
      case 'csvmonth':download('orcamento-'+keyNow()+'.csv','﻿'+C.toCSV(S.store,keyNow()),'text/csv');break;
      case 'csvall':download('orcamento-tudo.csv','﻿'+C.toCSV(S.store,null),'text/csv');break;
      case 'backup':download('orcamento-backup-'+realKey()+'.json',JSON.stringify(S.store,null,2),'application/json');break;
      case 'clearmonth':if(window.confirm('Apagar TODOS os lançamentos de '+C.monthLabel(S.y,S.m)+'?')){commit(C.clearMonth(S.store,keyNow()));toast('Mês limpo');}break;
      case 'applyrec':{var ar=C.applyRecurring(S.store,keyNow(),canWriteOwner);if(ar.added>0){commit(ar.store);toast(ar.added+(ar.added>1?' contas fixas lançadas':' conta fixa lançada'));}else toast('Nada pendente');break;}
      case 'delrec':{var rr=(S.store.recurring||[]).filter(function(x){return x.id===val;})[0];if(rr&&window.confirm('Remover a conta fixa "'+rr.name+'"? Os lançamentos já feitos continuam.')){commit(C.removeRecurring(S.store,val));toast('Conta fixa removida');}break;}
      case 'import':openImport();break;
      case 'impdo':doImport();break;
      case 'teto-new':S.goalForm={cat:val||'',limit:'',editing:false,catNew:false};openSheet('teto');break;
      case 'teto-edit':S.goalForm={cat:val,limit:String((S.store.goals||{})[val]||'').replace('.',','),editing:true,catNew:false};openSheet('teto');break;
      case 'teto-save':{var lim=C.parseMoney(S.goalForm.limit);var gc=String(S.goalForm.cat||'').trim();if(!gc||!isFinite(lim)||lim<=0){toast('Escolha a categoria e o teto');break;}
        S.sheet=null;S.envSel=gc;commit(C.setGoal(S.store,gc,lim));toast('Teto salvo');break;}
      case 'teto-del':if(window.confirm('Remover o teto de '+val+'?')){S.sheet=null;S.envSel=null;commit(C.setGoal(S.store,val,0));toast('Teto removido');}break;
      case 'obj-new':S.objForm={name:'',target:'',monthly:'',deadline:''};openSheet('obj');break;
      case 'obj-save':{var ot=C.parseMoney(S.objForm.target);var on=S.objForm.name.trim();if(!on||!isFinite(ot)||ot<=0){toast('Preencha objetivo e valor-alvo');break;}
        var om=C.parseMoney(S.objForm.monthly);var od=/^\d{4}-\d{2}$/.test((S.objForm.deadline||'').trim())?S.objForm.deadline.trim():'';
        S.sheet=null;commit(C.setObjective(S.store,{id:C.uid(),name:on,target:Math.round(ot*100)/100,monthly:isFinite(om)&&om>0?Math.round(om*100)/100:0,saved:0,deadline:od}));toast('Objetivo criado');break;}
      case 'aporte':{var ob=(S.store.objectives||[]).filter(function(x){return x.id===val;})[0];if(ob&&(+ob.monthly||0)>0){commit(C.addContribution(S.store,val,+ob.monthly||0));toast('Guardado');}break;}
      case 'aportec':S.valCtx={t:'aporte',id:val};S.valInput='';openSheet('valor');break;
      case 'delobj':{var dob=(S.store.objectives||[]).filter(function(x){return x.id===val;})[0];if(dob&&window.confirm('Excluir o objetivo "'+dob.name+'"?')){commit(C.removeObjective(S.store,val));toast('Objetivo excluído');}break;}
      case 'reserveleft':{var lf=C.summarize(list(),'all').balance;if(lf>0){commit(C.addReserve(S.store,lf));toast('Guardado na reserva');}else toast('Não há sobra neste mês');break;}
      case 'reserveother':S.valCtx={t:'reserva'};S.valInput='';openSheet('valor');break;
      case 'reservereset':if(window.confirm('Zerar a reserva de emergência?')){commit(Object.assign({},S.store,{reserve:0}));toast('Reserva zerada');}break;
      case 'val-save':doVal();break;
      case 'changepin':changePin();break;
      case 'savecod':{var cv=(S.codForm||'').trim();if(cv.length<4){toast('O código precisa de ao menos 4 caracteres');break;}saveCodigo(cv);break;}
      default:return;
    }
  }
  function onInput(ev){
    var el=ev.target;var f=el.getAttribute&&el.getAttribute('data-field');
    if(!f){if(el.getAttribute&&el.getAttribute('data-act')==='impdesc')S.imp.rows[+el.getAttribute('data-i')].desc=el.value;return;}
    switch(f){
      case 'q':{S.filter.q=el.value;var pos=el.selectionStart;render();var qn=document.querySelector('[data-field="q"]');if(qn){qn.focus();try{qn.setSelectionRange(pos,pos);}catch(e){}}return;}
      case 'desc':S.form.desc=el.value;updResult();return;
      case 'day':el.value=el.value.replace(/\D/g,'').slice(0,2);S.form.day=el.value;return;
      case 'method':S.form.method=el.value;return;
      case 'parcels':el.value=el.value.replace(/\D/g,'').slice(0,2);S.form.parcels=el.value;updResult();return;
      case 'catnew':S.form.cat=el.value;updResult();return;
      case 'gcat':S.goalForm.cat=el.value;return; case 'glimit':S.goalForm.limit=el.value;return;
      case 'oname':S.objForm.name=el.value;return; case 'otarget':S.objForm.target=el.value;return;
      case 'omonthly':S.objForm.monthly=el.value;return; case 'odeadline':S.objForm.deadline=el.value;return;
      case 'val':S.valInput=el.value;return;
      case 'pinatual':el.value=el.value.replace(/\D/g,'').slice(0,6);S.pinForm.atual=el.value;return;
      case 'pinnova':el.value=el.value.replace(/\D/g,'').slice(0,6);S.pinForm.nova=el.value;return;
      case 'codform':S.codForm=el.value;return;
      case 'impmonth':S.imp.month=el.value.trim();return; case 'impcard':S.imp.card=el.value;return;
    }
  }
  function onChange(ev){
    var el=ev.target;var a=el.getAttribute&&el.getAttribute('data-act');if(!a)return;
    if(a==='impfile')handlePdf(el.files&&el.files[0]);
    else if(a==='imptoggle'){S.imp.rows[+el.getAttribute('data-i')].include=el.checked;updImpSummary();}
    else if(a==='impall'){var ck=el.checked;S.imp.rows.forEach(function(r){r.include=ck;});renderSheet();}
    else if(a==='impowner')S.imp.rows[+el.getAttribute('data-i')].owner=el.value;
    else if(a==='impgroup')S.imp.group=el.checked;
    else if(a==='restorefile'){restoreBackup(el.files&&el.files[0]);el.value='';}
    else if(a==='teto-select'){if(el.value==='__new__'){S.goalForm.catNew=true;S.goalForm.cat='';renderSheet();var gi=document.querySelector('[data-field="gcat"]');if(gi)gi.focus();}else S.goalForm.cat=el.value;}
  }
  function onKey(ev){
    var t=ev.target;var tag=(t.tagName||'').toLowerCase();var typing=tag==='input'||tag==='select'||tag==='textarea';
    if(ev.key==='Escape'&&S.sheet){closeSheet();return;}
    if(S.sheet==='novo'&&!typing&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){
      if(/^[0-9]$/.test(ev.key)){ev.preventDefault();keyPress(ev.key);return;}
      if(ev.key===','||ev.key==='.'){ev.preventDefault();keyPress(',');return;}
      if(ev.key==='Backspace'){ev.preventDefault();keyPress('←');return;}
    }
    if((ev.key==='Enter'||ev.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'){ev.preventDefault();t.click();return;}
    if(ev.key==='Enter'&&typing){var f=t.getAttribute('data-field');
      if(f==='val'){ev.preventDefault();doVal();}else if(f==='q'){t.blur();}else if(f==='pinnova'){ev.preventDefault();changePin();}}
  }
  function bindEvents(){
    document.addEventListener('click',onClick);
    document.addEventListener('input',onInput);
    document.addEventListener('change',onChange);
    document.addEventListener('keydown',onKey);
    document.addEventListener('mousemove',function(ev){var el=ev.target&&ev.target.closest?ev.target.closest('[data-tip]'):null;if(el)showTip(el.getAttribute('data-tip'),ev.clientX,ev.clientY);else hideTip();});
    window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(SCREENS.indexOf(h)>-1&&h!==S.screen){S.sheet=null;go(h);render();}});
  }

  if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
})();
</script>

  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}
