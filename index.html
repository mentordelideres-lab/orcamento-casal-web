<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento do Casal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='104' fill='%23D4FF4F'/%3E%3Ctext x='256' y='312' font-family='monospace' font-size='150' font-weight='700' text-anchor='middle' fill='%230B0C0E'%3EM%26I%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orçamento">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0E; --headerBg:rgba(11,12,14,.92); --surface:#121418; --surface2:#171A1F;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.10); --hair:rgba(255,255,255,.05);
    --track:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06);
    --strong:#FFFFFF; --text:#E7E9EC; --muted:#8A8F99; --faint:#5C6168;
    --accent:#D4FF4F; --accentSoft:rgba(212,255,79,.12); --bar:#D4FF4F;
    --pos:#5BE08A; --posSoft:rgba(91,224,138,.30); --neg:#FF6B6B; --negSoft:rgba(255,107,107,.14); --warn:#FFB357;
    --teal:#4FD8D8; --blue:#6EA8FF; --purple:#C78BFF;
    --cfix:#6EA8FF; --cvar:#D4FF4F;
  }
  :root[data-theme="light"]{
    --bg:#F1F1EE; --headerBg:rgba(241,241,238,.93); --surface:#FFFFFF; --surface2:#F7F7F4;
    --line:rgba(17,19,22,.10); --line2:rgba(17,19,22,.14); --hair:rgba(17,19,22,.07);
    --track:rgba(17,19,22,.10); --chip:rgba(17,19,22,.05);
    --strong:#0B0C0E; --text:#22262B; --muted:#5F6670; --faint:#6B727C;
    --accent:#5A7A00; --accentSoft:rgba(90,122,0,.10); --bar:#6E9400;
    --pos:#1F7A4D; --posSoft:rgba(31,122,77,.24); --neg:#C2342F; --negSoft:rgba(194,52,47,.12); --warn:#8A6200;
    --teal:#0E7C7B; --blue:#1E5BC6; --purple:#7B3FA0;
    --cfix:#1E5BC6; --cvar:#6E9400;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:400 15px/1.55 Archivo,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  button{font-family:Archivo,sans-serif;cursor:pointer}
  input{font-family:Archivo,sans-serif}
  input::placeholder{color:var(--faint)}
  a{color:var(--accent);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--muted) 40%, transparent);border-radius:999px}

  header{position:sticky;top:0;z-index:40;background:var(--headerBg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .head{max-width:1560px;margin:0 auto;padding:13px max(16px,env(safe-area-inset-left)) 13px max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{width:40px;height:40px;flex:none;border-radius:11px;background:var(--accent);color:#0B0C0E;display:grid;place-items:center;font:600 14px/1 "IBM Plex Mono",monospace}
  .brand b{font:600 16px/1.1 Archivo;letter-spacing:-.01em;color:var(--strong);white-space:nowrap}
  .brand .st{display:flex;align-items:center;gap:6px;font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .dot{width:6px;height:6px;border-radius:999px;background:var(--muted)}
  .spacer{flex:1 1 10px}
  .seg{display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
  .seg button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:0 13px;height:30px;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
  .seg button.on{background:var(--accent);color:#0B0C0E}
  .seg .nav{width:30px;padding:0;font-size:15px}
  .mlabel{min-width:132px;text-align:center;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--strong)}
  .ghostbtn{height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:10px;background:transparent;color:var(--muted);font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
  .ghostbtn:hover{border-color:var(--accent);color:var(--accent)}

  main{max-width:1560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
  .toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:9px;font:500 12px/1 Archivo;white-space:nowrap}
  .pill.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
  .pdot{width:7px;height:7px;border-radius:999px}

  .card{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
  .hero{overflow:hidden}
  .herotop{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;padding:26px 28px;align-items:center}
  .hk{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .hv{font:700 clamp(38px,6vw,60px)/1 Archivo;letter-spacing:-.035em;margin-top:9px}
  .hsub{font-size:13px;color:var(--muted);margin-top:8px}
  .ring{width:108px;height:108px;flex:none;border-radius:999px;display:grid;place-items:center}
  .ringin{width:88px;height:88px;border-radius:999px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .ringin b{font:700 23px/1 Archivo;letter-spacing:-.03em}
  .ringin span{font:500 8px/1.2 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
  .vtitle{font:600 14px/1.3 Archivo}
  .vtext{font-size:13px;color:var(--muted);margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .stat{background:var(--surface);padding:16px 22px;display:flex;flex-direction:column;gap:6px}
  .stat .sk{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .stat .sv{font:700 23px/1 Archivo;letter-spacing:-.03em;color:var(--strong)}
  .stat .sf{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--faint)}
  .pbar{height:4px;border-radius:999px;background:var(--track);overflow:hidden}
  .pbar>i{display:block;height:100%;background:var(--bar)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
  .layout{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:16px}
  .colmain{flex:1 1 580px;min-width:0;display:flex;flex-direction:column;gap:16px}
  aside{flex:1 1 330px;min-width:290px;max-width:390px;position:sticky;top:84px}
  @media(max-width:900px){aside{position:static;max-width:none}aside.apanel{display:none}}

  .sec{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
  .h2{margin:0;font:600 13px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--strong)}
  .rowb{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .small{font-size:12px;color:var(--muted)}

  .chart{display:grid;gap:9px;align-items:end;height:150px}
  .col{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;height:100%;min-width:0}
  .bars{display:flex;align-items:flex-end;gap:4px;height:110px}
  .bars>i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
  .clabel{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center}
  .cval{display:flex;flex-direction:column;gap:2px;min-width:0;font:500 10px/1.15 "IBM Plex Mono",monospace;text-align:center}
  .cval span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cval .cin{color:var(--pos)} .cval .cout{color:var(--strong)}
  .legend b{color:var(--strong);font-weight:700}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font:400 11px/1 "IBM Plex Mono",monospace;color:var(--faint)}
  .legend span{display:flex;align-items:center;gap:7px}
  .sq{width:9px;height:9px;border-radius:2px}

  .catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
  .catrow .n{font:500 13px/1.3 Archivo;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catrow .v{font:600 13px/1.3 Archivo;color:var(--strong);white-space:nowrap}
  .catrow .v em{font-style:normal;color:var(--faint);font:400 11px/1 "IBM Plex Mono",monospace}
  .meter{grid-column:1/-1;height:5px;border-radius:999px;background:var(--track);overflow:hidden}
  .meter>i{display:block;height:100%;border-radius:999px}
  .catsplit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:3px}
  .catsplit span{display:flex;align-items:center;gap:5px;font:400 11px/1.2 Archivo;color:var(--muted)}
  .catsplit b{color:var(--strong);font-weight:600}
  .catbox{padding:7px 0;border-bottom:1px solid var(--hair)}
  .catbox:last-child{border-bottom:0}
  .cathd{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
  .cathd .chev{color:var(--muted);font-size:11px;width:11px;flex:none;transition:color .15s}
  .catbox.on .cathd .chev{color:var(--accent)}
  .cathd .n{flex:1;min-width:0;font:500 13px/1.3 Archivo;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cathd .v{font:600 13px/1.3 Archivo;color:var(--strong);white-space:nowrap}
  .cathd .v em{font-style:normal;color:var(--faint);font:400 11px/1 "IBM Plex Mono",monospace}
  .catbox .meter{margin-top:7px}
  .catlist{display:flex;flex-direction:column;margin-top:8px;padding:4px 11px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
  .catli{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--hair);font:500 13px Archivo}
  .catli:last-child{border-bottom:0}
  .catli .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--strong)}
  .catli .nm em{font-style:normal;color:var(--faint);font:400 11px/1 "IBM Plex Mono",monospace;margin-left:5px}
  .catli .st{font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:5px}
  .catli b{white-space:nowrap;color:var(--strong)}
  .catli b.pd{color:var(--muted)}

  /* barra de abas inferior + FAB */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:stretch;gap:4px;
    padding:7px max(10px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));
    background:var(--headerBg);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .tabitem{flex:1;max-width:140px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;
    font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
  .tabitem svg{width:22px;height:22px}
  .tabitem.on{color:var(--accent)}
  .fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(66px + env(safe-area-inset-bottom));z-index:51;width:54px;height:54px;border:0;border-radius:999px;
    background:var(--accent);color:#0B0C0E;display:grid;place-items:center;box-shadow:0 16px 32px -10px rgba(212,255,79,.55),0 2px 0 rgba(0,0,0,.2)}
  .fab svg{width:26px;height:26px;stroke-width:2.6}
  .fab:active{transform:scale(.94)}

  /* donut + cards de categoria */
  .donutwrap{display:flex;justify-content:center;padding:4px 0 2px}
  .donut{width:168px;height:168px;border-radius:999px;display:grid;place-items:center;position:relative}
  .donut::after{content:"";position:absolute;inset:0;border-radius:999px;box-shadow:0 0 0 1px var(--hair) inset}
  .donutin{width:118px;height:118px;border-radius:999px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .donutin span{font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .donutin b{font:700 22px/1 Archivo;letter-spacing:-.03em;color:var(--strong)}
  .catcards{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;margin:0 -4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .catcards::-webkit-scrollbar{height:0}
  .catcard{flex:0 0 auto;min-width:118px;scroll-snap-align:start;text-align:left;border:1px solid var(--line2);background:var(--surface2);border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:5px}
  .catcard.on{border-color:var(--accent);background:var(--accentSoft)}
  .cc-top{display:flex;align-items:center;justify-content:space-between}
  .cc-top em{font-style:normal;font:600 11px/1 "IBM Plex Mono",monospace;color:var(--muted)}
  .cc-name{font:500 12px/1.2 Archivo;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cc-val{font:700 15px/1 Archivo;letter-spacing:-.02em;color:var(--strong)}
  .catdetail{margin-top:10px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .donut2{position:relative;width:168px;height:168px}
  .donut2 svg{width:100%;height:100%;display:block}
  .seg{cursor:pointer;transition:stroke-width .12s,opacity .12s}
  .seg:hover{opacity:.82}
  .donut2 .donutin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:999px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 8px}
  .donut2 .donutin span{font:500 9px/1.1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .donut2 .donutin b{font:700 21px/1 Archivo;letter-spacing:-.03em;color:var(--strong)}
  .catleg{display:flex;flex-direction:column;gap:2px;margin-top:12px}
  .catlegit{display:grid;grid-template-columns:13px 94px 1fr 100px 46px;align-items:center;gap:10px;width:100%;padding:9px 9px;border-radius:9px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer}
  .catlegit:hover{background:var(--surface2)}
  .catlegit.on{background:var(--accentSoft);border-color:var(--accent)}
  .catlegit .pdot{justify-self:center}
  .catlegit .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px/1.2 Archivo;color:var(--text)}
  .catlegit .bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
  .catlegit .bar>i{display:block;height:100%;border-radius:999px}
  .catlegit .vv{font:600 13px/1 Archivo;color:var(--strong);white-space:nowrap;text-align:right}
  .catlegit .pp{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--faint);white-space:nowrap;text-align:right}
  #tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font:500 12px/1.4 Archivo;color:var(--strong);box-shadow:0 16px 36px -14px rgba(0,0,0,.7);opacity:0;transition:opacity .1s;white-space:nowrap}
  #tip.show{opacity:1}
  @media(max-width:560px){.catlegit{grid-template-columns:12px 72px 1fr 88px 42px;gap:8px;padding:8px 6px}}

  /* fixo vs variável */
  .fvbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--track);margin:10px 0 14px}
  .fvbar>i{display:block;height:100%;cursor:pointer}
  .fvbtn{cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit;transition:border-color .12s}
  .fvbtn:hover{border-color:var(--line2)}
  .fvbar>i+i{box-shadow:inset 2px 0 0 var(--surface)}
  .fvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fvit{display:flex;flex-direction:column;gap:3px;padding:11px 13px;border:1px solid var(--line2);border-radius:12px;background:var(--surface2)}
  .fvit .fvk{display:flex;align-items:center;gap:7px;font:600 12px/1 Archivo;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .fvit .fvv{font:700 19px/1.1 Archivo;color:var(--strong)}
  .fvit .fvm{font:400 11px/1.2 "IBM Plex Mono",monospace;color:var(--faint)}
  @media(max-width:560px){.fvit .fvv{font-size:17px}}
  .fixtag{font:700 9.5px/1 Archivo;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line2);background:var(--chip);color:var(--muted);cursor:pointer}
  .fixtag.fix{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
  .sobrabreak{flex:1;min-width:230px;display:flex;flex-direction:column;align-self:center}
  .sobraln{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--hair)}
  .sobraln:first-child{border-top:0}
  .sobraln>span{display:flex;align-items:center;gap:8px;font:500 13.5px Archivo;color:var(--muted)}
  .sobraln>b{font:700 15px "IBM Plex Mono",monospace;white-space:nowrap}
  .sobraln.total{border-top:1.5px solid var(--line2);margin-top:3px}
  .sobraln.total>span{color:var(--strong);font-weight:700}
  .sobraln.total>b{font-size:17px}
  .objsum{margin:4px 0 14px}
  .objsum-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  /* cards de meta/objetivo */
  .goalcard{display:flex;gap:13px;padding:14px 2px;border-bottom:1px solid var(--hair)}
  .goalcard:last-child{border-bottom:0}
  .gc-ic{width:52px;height:52px;flex:none;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent)}
  .gc-ic svg{width:26px;height:26px}
  .gc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .gc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gc-name{font:600 15px/1.2 Archivo;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gc-pct{font:700 15px/1 Archivo;white-space:nowrap}
  .gc-sub{font:400 12px/1.3 Archivo;color:var(--muted)}
  .gc-badge{align-self:flex-start;font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
  .gc-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}

  .items{display:flex;flex-direction:column}
  .it{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--hair)}
  .it:last-child{border-bottom:0}
  .it .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .it .nm{font:500 14px/1.3 Archivo;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .nm.paid{color:var(--faint);text-decoration:line-through}
  .it .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .badge{padding:3px 7px;border-radius:5px;font:600 9px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
  .mtxt{font:400 10px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .amt{font:700 15px/1 Archivo;letter-spacing:-.02em;white-space:nowrap}
  .iconbtn{width:28px;height:28px;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:8px;display:grid;place-items:center;font-size:13px}

<body>
<div id="app"></div>

<script>
/* ===================== budget-core (estendido) ===================== */
(function () {
  'use strict';
  var MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var MONTHS_ABBR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var PEOPLE={M:{code:'M',name:'Matheus'},I:{code:'I',name:'Isabella'},C:{code:'C',name:'Conjunto'}};
  window.API_ROOT='https://pggcbvafkwyqyvlkiyti.supabase.co/functions/v1/orcamento';
  window.BASE=window.API_ROOT;
  window.LOGIN_URL='login.html';
  window.TOKKEY='orc_token';
  window.getTok=function(){try{return localStorage.getItem('orc_token')||'';}catch(e){return '';}};
  window.afetch=function(u,o){o=o||{};var h={};if(o.headers){for(var k in o.headers)h[k]=o.headers[k];}var t=window.getTok();if(t)h['x-orc-token']=t;o.headers=h;return fetch(u,o);};
  window.orcLogout=function(){var t=window.getTok();try{localStorage.removeItem('orc_token');}catch(e){}try{fetch(window.API_ROOT+'/api/logout',{method:'POST',headers:t?{'x-orc-token':t}:{}});}catch(e){}location.replace('login.html');};
  var STORAGE_KEY='orcamento-casal-v1', API=BASE+'/api/budget';
  function pad(n){return String(n).padStart(2,'0');}
  function keyOf(y,m){return y+'-'+pad(m);}
  function shiftMonth(y,m,d){var i=(y*12+(m-1))+d;return {y:Math.floor(i/12),m:(i%12)+1};}
  function monthLabel(y,m){return MONTHS[m-1]+' '+y;}
  function monthAbbr(y,m){return MONTHS_ABBR[m-1];}
  function brl(v,o){var cents=!o||o.cents!==false;var n=Math.abs(Number(v)||0);
    var s=n.toLocaleString('pt-BR',{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0});
    return (v<0?'-R$ ':'R$ ')+s;}
  function pctText(v){return (Math.round(v*10)/10).toLocaleString('pt-BR')+'%';}
  function parseMoney(raw){var t=String(raw==null?'':raw).trim().replace(/[^0-9.,-]/g,'');
    if(!t)return NaN; if(t.indexOf(',')>-1)return Number(t.replace(/\./g,'').replace(',','.'));
    if((t.match(/\./g)||[]).length>1)return Number(t.replace(/\./g,'')); return Number(t);}
  function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  var RULES=[
    [/cart[ãa]o|visa|amex|master|nubank|\bc6\b|elo\b/i,'Cartões','card'],
    [/luz|energia|enel|cemig|light/i,'Moradia','bolt'],
    [/[áa]gua|saneam|sabesp|cagece/i,'Moradia','drop'],
    [/aluguel|condom[íi]nio|im[óo]vel|reforma|apartamento|\bapto\b|\bap\b|financiamento|financ\.|presta[çc][ãa]o do ap/i,'Moradia','home'],
    [/net|vivo|claro|\btim\b|internet|telefone|celular|streaming|netflix|spotify|apple\.com|disney|hbo|max\b/i,'Assinaturas','wifi'],
    [/imposto|iptu|ipva|\bdas\b|tribut|inss|simples/i,'Impostos','receipt'],
    [/combust[íi]vel|gasolina|posto|\buber|\b99\b|99\s?ride|99\s?food|carro|veloe|ped[áa]gio|pedagio|rodoanel|estacion|cloudpark|park/i,'Transporte','car'],
    [/mercado|aliment|feira|restaurante|ifood|ifd|padaria|pao de acucar|pão de açúcar|dia brasil|carrefour|churrasc|pizz|burger|lanch|comida|keeta|cacau|gourmet|food/i,'Alimentação','cart'],
    [/escola|faculdade|curso|especializa|mentoria|livro|treinamento/i,'Educação','book'],
    [/plano de sa[úu]de|m[ée]dico|farm[áa]cia|dental|dentista|academia|terapia|drogasil|droga|raia/i,'Saúde','heart'],
    [/d[íi]zimo|oferta|doa[çc][ãa]o|igreja/i,'Doação','hands'],
    [/contador|advogado|consultoria|assessoria|ag[êe]ncia|hotel|villa/i,'Serviços','briefcase'],
    [/adidas|nike|modas|cea |cosmetic|onnix|loja|shopping|store|zerezes/i,'Compras','bag'],
    [/sal[áa]rio|pr[óo]-?labore|renda|recebimento|comiss|dividendo/i,'Renda','wallet']
  ];
  function classify(desc,group){for(var i=0;i<RULES.length;i++){if(RULES[i][0].test(desc))return {cat:RULES[i][1],icon:RULES[i][2]};}
    return group==='pj'?{cat:'Serviços',icon:'briefcase'}:{cat:'Outros',icon:'tag'};}

  function loadLocal(){try{var raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;var d=JSON.parse(raw);if(d&&d.entries)return d;}catch(e){}return null;}
  function saveLocal(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(e){}return s;}
  function loadRemote(){if(typeof fetch!=='function')return Promise.resolve(null);
    return afetch(API,{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null;})
      .then(function(d){return d&&d.entries?d:null;}).catch(function(){return null;});}
  function saveRemote(s){if(typeof fetch!=='function')return Promise.resolve(false);
    return afetch(API,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(s)})
      .then(function(r){return r.ok;}).catch(function(){return false;});}

  function buildEntries(form,y,m){
    var amount=parseMoney(form.value);var desc=String(form.desc||'').trim();
    if(!desc||!isFinite(amount)||amount<=0)return null;
    var day=Math.min(31,Math.max(0,parseInt(form.day,10)||0));
    var times = form.repeat==='parcelado'?Math.max(2,Math.min(60,parseInt(form.parcels,10)||2))
      : form.repeat==='fixo'?Math.max(1,Math.min(60,parseInt(form.months,10)||3)) : 1;
    var each = form.repeat==='parcelado'?amount/times:amount;
    var group=form.kind==='in'?'in':(form.group||'casa');
    var c=(form.cat&&String(form.cat).trim())?{cat:String(form.cat).trim(),icon:classify(desc,group).icon}:classify(desc,group);
    var out=[];
    for(var i=0;i<times;i++){var at=shiftMonth(y,m,i);
      out.push({key:keyOf(at.y,at.m),entry:{
        id:uid(),
        name: form.repeat==='parcelado'?desc+' ('+(i+1)+'/'+times+')':desc,
        kind:form.kind==='in'?'in':'out', amount:Math.round(each*100)/100, day:day,
        owner:form.owner||'C', group:group, cat:c.cat, icon:c.icon, paid:false,
        method:String(form.method||'').trim(), repeat:form.repeat||'none', fixo:!!form.fixo,
        parcel: form.repeat==='parcelado'?{n:i+1,total:times}:null
      }});}
    return out;
  }
  function withEntries(store,built){var e=Object.assign({},store.entries);
    built.forEach(function(b){e[b.key]=(e[b.key]||[]).concat([b.entry]);});return Object.assign({},store,{entries:e});}
  function mapMonth(store,key,fn){var e=Object.assign({},store.entries);e[key]=fn((e[key]||[]).slice());return Object.assign({},store,{entries:e});}
  function togglePaid(store,key,id){return mapMonth(store,key,function(l){return l.map(function(e){return e.id===id?Object.assign({},e,{paid:!e.paid}):e;});});}
  function updateEntry(store,key,id,patch){return mapMonth(store,key,function(l){return l.map(function(e){return e.id===id?Object.assign({},e,patch):e;});});}
  function removeEntry(store,key,id){return mapMonth(store,key,function(l){return l.filter(function(e){return e.id!==id;});});}
  function copyMonth(store,from,to){var src=store.entries[from]||[];
    var clone=src.filter(function(e){return !e.parcel;}).map(function(e){return Object.assign({},e,{id:uid(),paid:false});});
    var e=Object.assign({},store.entries);e[to]=(e[to]||[]).concat(clone);return Object.assign({},store,{entries:e});}
  function setGoal(store,cat,limit){var g=Object.assign({},store.goals||{});if(!isFinite(limit)||limit<=0)delete g[cat];else g[cat]=limit;return Object.assign({},store,{goals:g});}
  var BASE_CATS=['Alimentação','Transporte','Moradia','Cartões','Assinaturas','Impostos','Educação','Saúde','Serviços','Compras','Doação','Outros'];
  function categoriesInUse(store){var set={};BASE_CATS.forEach(function(c){set[c]=1;});
    Object.keys(store.entries||{}).forEach(function(k){(store.entries[k]||[]).forEach(function(e){if(e.kind==='out'&&e.cat)set[e.cat]=1;});});
    Object.keys(store.goals||{}).forEach(function(c){set[c]=1;});return Object.keys(set).sort();}
  function setObjective(store,obj){var list=(store.objectives||[]).slice(),i=-1;
    for(var j=0;j<list.length;j++)if(list[j].id===obj.id)i=j;
    if(i>=0)list[i]=Object.assign({},list[i],obj);else list.push(obj);return Object.assign({},store,{objectives:list});}
  function removeObjective(store,id){return Object.assign({},store,{objectives:(store.objectives||[]).filter(function(o){return o.id!==id;})});}
  function addContribution(store,id,amount){var list=(store.objectives||[]).map(function(o){return o.id===id?Object.assign({},o,{saved:Math.round(((+o.saved||0)+amount)*100)/100}):o;});return Object.assign({},store,{objectives:list});}
  function clearMonth(store,key){var e=Object.assign({},store.entries);delete e[key];return Object.assign({},store,{entries:e});}

  // fração da renda da casa de cada pessoa (pote comum: rateio proporcional à renda)
  function incomeFrac(list,who){var inM=0,inI=0;
    list.forEach(function(e){if(e.kind==='in'){if(e.owner==='M')inM+=e.amount;else if(e.owner==='I')inI+=e.amount;}});
    var base=inM+inI;if(base<=0)return 0.5;return who==='M'?inM/base:inI/base;}
  function aggItems(items,extra){
    var income=0,expense=0,paid=0,ic=0,ec=0,oc=0;
    items.forEach(function(e){if(e.kind==='in'){income+=e.amount;ic++;}else{expense+=e.amount;ec++;if(e.paid)paid+=e.amount;else oc++;}});
    var o={items:items,income:income,expense:expense,balance:income-expense,paid:paid,open:expense-paid,
      incomeCount:ic,expenseCount:ec,openCount:oc,
      usedPct:income>0?(expense/income)*100:(expense>0?100:0),
      paidPct:expense>0?(paid/expense)*100:0, leftPct:income>0?((income-expense)/income)*100:0};
    if(extra)for(var k in extra)o[k]=extra[k];return o;}
  function summarize(list,owner){
    // cada pessoa vê só o que é dela; Conjunto só o compartilhado; Geral tudo
    var sel=owner&&owner!=='all'?list.filter(function(e){return e.owner===owner;}):list.slice();
    return aggItems(sel,{mode:owner==='all'?'all':(owner==='C'?'shared':'person')});
  }
  // distribuição da renda da casa entre o casal (quanto cada um recebe, em % proporcional)
  function incomeSplit(list){var m=0,i=0,c=0;
    list.forEach(function(e){if(e.kind==='in'){if(e.owner==='M')m+=e.amount;else if(e.owner==='I')i+=e.amount;else c+=e.amount;}});
    var base=m+i;return {M:m,I:i,C:c,total:m+i+c,fracM:base>0?m/base:0.5,fracI:base>0?i/base:0.5,base:base};}
  function byCategory(sum,pal){var map={},own={};sum.items.forEach(function(e){if(e.kind!=='out')return;map[e.cat]=(map[e.cat]||0)+e.amount;
      var o=own[e.cat]||(own[e.cat]={M:0,I:0,C:0});o[e.owner]=(o[e.owner]||0)+e.amount;});
    var rows=Object.keys(map).map(function(k){return {name:k,amount:map[k],own:own[k]};});rows.sort(function(a,b){return b.amount-a.amount;});
    var max=rows.length?rows[0].amount:1;
    return rows.map(function(r,i){var o=r.own||{M:0,I:0,C:0};var tot=r.amount||1;
      var split=['M','I','C'].map(function(k){var v=o[k]||0;return {code:k,name:PEOPLE[k].name,amount:v,amountText:brl(v),frac:v/tot,pct:Math.round(v/tot*100)};});
      return {name:r.name,amount:r.amount,amountText:brl(r.amount),
      shareText:pctText(sum.expense>0?(r.amount/sum.expense)*100:0),pct:Math.round((r.amount/max)*100),color:pal[i%pal.length],split:split};});}
  function byPerson(sum,colors){var t={M:0,I:0,C:0};sum.items.forEach(function(e){if(e.kind==='out')t[e.owner]=(t[e.owner]||0)+e.amount;});
    var all=t.M+t.I+t.C;return ['M','I','C'].map(function(k){var v=t[k]||0;return {code:k,name:PEOPLE[k].name,amount:v,amountText:brl(v),
      pct:all>0?Math.round((v/all)*100):0,pctText:pctText(all>0?(v/all)*100:0),color:colors[k]};});}
  // fixo/variável: respeita marcação manual (e.fixo true/false); senão deduz de conta recorrente
  function isFixed(e){return e.fixo===true?true:(e.fixo===false?false:(!!e.recId||e.repeat==='fixo'));}
  function fixedVariable(sum){
    var fx=0,vr=0,fc=0,vc=0;
    sum.items.forEach(function(e){if(e.kind!=='out')return;var isFix=isFixed(e);
      if(isFix){fx+=e.amount;fc++;}else{vr+=e.amount;vc++;}});
    var tot=fx+vr;
    return {fixed:fx,variable:vr,fixedCount:fc,variableCount:vc,total:tot,
      fixedText:brl(fx),variableText:brl(vr),
      fixedPct:tot>0?Math.round(fx/tot*100):0,variablePct:tot>0?Math.round(vr/tot*100):0,
      fixedShare:tot>0?pctText(fx/tot*100):'0%',variableShare:tot>0?pctText(vr/tot*100):'0%'};}
  function upcoming(sum,limit){return sum.items.filter(function(e){return e.kind==='out'&&!e.paid;})
    .sort(function(a,b){return (a.day||99)-(b.day||99);}).slice(0,limit||6)
    .map(function(e){return {id:e.id,name:e.name,amountText:brl(e.amount),dayText:e.day?pad(e.day):'—'};});}
  function series(store,y,m,n,owner){var all=[];for(var i=n-1;i>=0;i--){var at=shiftMonth(y,m,-i);
    var s=summarize(store.entries[keyOf(at.y,at.m)]||[],owner);
    all.push({y:at.y,m:at.m,label:monthAbbr(at.y,at.m),full:monthLabel(at.y,at.m),income:s.income,expense:s.expense,isCurrent:i===0});}
    // só meses com movimento (mais o atual) — não enche de meses vazios anteriores
    var out=all.filter(function(r){return r.isCurrent||r.income>0||r.expense>0;});
    if(!out.length)out=[all[all.length-1]];
    var max=out.reduce(function(a,r){return Math.max(a,r.income,r.expense);},1);
    var avg=out.reduce(function(a,r){return a+r.expense;},0)/(out.length||1);
    var prev=out.length>1?out[out.length-2]:null,cur=out[out.length-1];
    return {rows:out.map(function(r){return Object.assign({},r,{incomePct:Math.round((r.income/max)*100),expensePct:Math.round((r.expense/max)*100),expenseText:brl(r.expense,{cents:false}),incomeText:brl(r.income,{cents:false})});}),
      avgText:brl(avg),deltaPct:prev&&prev.expense>0?((cur.expense-prev.expense)/prev.expense)*100:0,prevLabel:prev?prev.full:'—'};}
  function goalRows(store,sum){var goals=store.goals||{},spent={};
    sum.items.forEach(function(e){if(e.kind==='out')spent[e.cat]=(spent[e.cat]||0)+e.amount;});
    return Object.keys(goals).map(function(cat){var limit=goals[cat],used=spent[cat]||0,pct=limit>0?(used/limit)*100:0;
      return {cat:cat,limit:limit,limitText:brl(limit,{cents:false}),used:used,usedText:brl(used),
        leftText:brl(Math.abs(limit-used)),over:used>limit,pct:pct,pctText:pctText(pct),bar:Math.min(100,Math.round(pct))};})
      .sort(function(a,b){return b.pct-a.pct;});}
  function verdict(sum){if(sum.income===0&&sum.expense===0)return {tone:'neutral',title:'Mês em branco',text:'Nenhum lançamento neste recorte.'};
    if(sum.balance<0)return {tone:'danger',title:'No vermelho',text:'Gastos acima da renda — faltam '+brl(Math.abs(sum.balance))+' pra fechar o mês.'};

    return {tone:'good',title:'Mês equilibrado',text:'Sobra '+brl(sum.balance)+' de '+brl(sum.income)+' que entraram.'};}

  /* ---------- contas fixas (recorrentes) ---------- */
  function addRecurring(store,tpl){var list=(store.recurring||[]).slice();list.push(tpl);return Object.assign({},store,{recurring:list});}
  function removeRecurring(store,id){return Object.assign({},store,{recurring:(store.recurring||[]).filter(function(r){return r.id!==id;})});}
  function pendingRecurring(store,key){var recs=store.recurring||[];var month=store.entries[key]||[];
    var have={};month.forEach(function(e){if(e.recId)have[e.recId]=1;});
    return recs.filter(function(r){return (!r.since||r.since<=key)&&!have[r.id];});}
  function applyRecurring(store,key,canWrite){
    var pend=pendingRecurring(store,key).filter(function(r){return canWrite?canWrite(r.owner):true;});
    if(!pend.length)return {store:store,added:0};
    var e=Object.assign({},store.entries);var list=(e[key]||[]).slice();
    pend.forEach(function(r){list.push({id:uid(),recId:r.id,name:r.name,kind:r.kind||'out',amount:r.amount,day:r.day||0,
      owner:r.owner||'C',group:r.group||(r.kind==='in'?'in':'casa'),cat:r.cat,icon:r.icon,paid:false,method:r.method||'',repeat:'fixo',parcel:null});});
    e[key]=list;return {store:Object.assign({},store,{entries:e}),added:pend.length};}

  /* ---------- reserva de emergência ---------- */
  function addReserve(store,amount){var cur=+store.reserve||0;return Object.assign({},store,{reserve:Math.round((cur+amount)*100)/100});}

  /* ---------- comparativo com o mês anterior ---------- */
  function categoryDeltas(store,y,m,owner){
    function catmap(key){var mp={};(store.entries[key]||[]).forEach(function(e){if(e.kind!=='out')return;if(owner&&owner!=='all'&&e.owner!==owner)return;mp[e.cat]=(mp[e.cat]||0)+e.amount;});return mp;}
    var p=shiftMonth(y,m,-1);var a=catmap(keyOf(y,m)),b=catmap(keyOf(p.y,p.m));
    var keys={};Object.keys(a).forEach(function(k){keys[k]=1;});Object.keys(b).forEach(function(k){keys[k]=1;});
    var rows=Object.keys(keys).map(function(k){var cur=a[k]||0,was=b[k]||0,diff=cur-was;
      return {cat:k,now:cur,was:was,diff:diff,pct:was>0?(diff/was)*100:(cur>0?100:0),abs:Math.abs(diff),
        diffText:(diff>=0?'+':'−')+brl(Math.abs(diff),{cents:false}).replace('R$ ','R$ ')};});
    rows=rows.filter(function(r){return r.abs>=1;}).sort(function(x,z){return z.abs-x.abs;});
    return {rows:rows,prevLabel:monthLabel(p.y,p.m)};}

  /* ---------- previsão de fechamento ---------- */
  function forecast(store,y,m,owner){
    var sum=summarize(store.entries[keyOf(y,m)]||[],owner);
    var hist=[];for(var i=1;i<=6;i++){var at=shiftMonth(y,m,-i);var s=summarize(store.entries[keyOf(at.y,at.m)]||[],owner);if(s.expense>0)hist.push(s.expense);}
    var avg=hist.length?hist.reduce(function(a,b){return a+b;},0)/hist.length:0;
    var projExpense=Math.max(sum.expense,avg);var projBalance=sum.income-projExpense;
    return {income:sum.income,expense:sum.expense,avg:avg,avgText:brl(avg,{cents:false}),
      projExpense:projExpense,projBalance:projBalance,projText:brl(projBalance),hasHist:hist.length>0,
      aboveAvg:avg>0&&sum.expense>avg};}

  /* ---------- exportar CSV (Excel pt-BR: ; e vírgula decimal) ---------- */
  function toCSV(store,key){
    var head=['Mes','Dia','Descricao','Tipo','Grupo','Categoria','Quem','Forma','Valor','Pago'];
    var out=[head];var keys=key?[key]:Object.keys(store.entries||{}).sort();
    keys.forEach(function(k){(store.entries[k]||[]).forEach(function(e){
      out.push([k,e.day||'',e.name,e.kind==='in'?'entrada':'saida',e.group,e.cat||'',
        (PEOPLE[e.owner]?PEOPLE[e.owner].name:e.owner),e.method||'',String(e.amount).replace('.',','),e.paid?'sim':'nao']);});});
    return out.map(function(r){return r.map(function(c){var s=String(c==null?'':c);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';');}).join('\r\n');}

  window.BudgetCore={MONTHS:MONTHS,PEOPLE:PEOPLE,pad:pad,keyOf:keyOf,shiftMonth:shiftMonth,monthLabel:monthLabel,
    addRecurring:addRecurring,removeRecurring:removeRecurring,pendingRecurring:pendingRecurring,applyRecurring:applyRecurring,
    addReserve:addReserve,categoryDeltas:categoryDeltas,forecast:forecast,toCSV:toCSV,
    brl:brl,pctText:pctText,parseMoney:parseMoney,uid:uid,classify:classify,
    loadLocal:loadLocal,saveLocal:saveLocal,loadRemote:loadRemote,saveRemote:saveRemote,
    buildEntries:buildEntries,withEntries:withEntries,togglePaid:togglePaid,updateEntry:updateEntry,removeEntry:removeEntry,
    copyMonth:copyMonth,setGoal:setGoal,clearMonth:clearMonth,categoriesInUse:categoriesInUse,
    setObjective:setObjective,removeObjective:removeObjective,addContribution:addContribution,
    summarize:summarize,byCategory:byCategory,byPerson:byPerson,incomeFrac:incomeFrac,incomeSplit:incomeSplit,isFixed:isFixed,
    upcoming:upcoming,series:series,goalRows:goalRows,verdict:verdict,fixedVariable:fixedVariable};
})();
</script>

  async function handlePdf(file){
    if(!file)return; if(!window.pdfjsLib){toast('Leitor de PDF não carregou');return;}
    S.imp.busy=true;render();
    try{
      var buf=await file.arrayBuffer();
      var pdf=await pdfjsLib.getDocument({data:buf}).promise;
      var lines=[];
      for(var p=1;p<=pdf.numPages;p++){
        var page=await pdf.getPage(p);var tc=await page.getTextContent();
        var rows={};
        tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str});});
        Object.keys(rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
          var line=rows[y].sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(' ').replace(/\s+/g,' ').trim();
          if(line)lines.push(line);

      var parsed=parseBradesco(lines);

      S.imp.rows=parsed.rows;S.imp.card=parsed.card||'';S.imp.busy=false;render();
    }catch(e){console.error(e);toast('Não consegui ler o PDF (pode ser imagem/escaneado)');S.imp.busy=false;render();}

  function parseBradesco(lines){
    var MES={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};

    var full=lines.join(' ').toUpperCase();
    if(full.indexOf('AMERICAN EXPRESS')>-1)card='Amex'; else if(full.indexOf('VISA')>-1)card='Visa';
    var MESES='JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ';
    for(var i=0;i<lines.length;i++){
      var ln=lines[i];
      if(/Lan[çc]amentos programados/i.test(ln)){prog=true;continue;}
      var mc=ln.match(/Final\s+\d+\s*\|\s*(.+)/i);
      if(mc){prog=false;var nm=mc[1].toUpperCase();owner=nm.indexOf('ISABELLA')>-1?'I':(nm.indexOf('MATHEUS')>-1?'M':'C');continue;}
      var md=ln.match(new RegExp('^(\\d{1,2})\\s+('+MESES+')$','i'));
      if(md){day=+md[1];continue;}
      if(/^\d{1,2}$/.test(ln)&&i+1<lines.length&&new RegExp('^('+MESES+')$','i').test(lines[i+1])){day=+ln;i++;continue;}
      if(prog)continue;
      var mt=ln.match(/^(.+?)\s+(-?[\d.]+,\d{2})$/);
      if(mt){
        var desc=mt[1].trim();var val=parseFloat(mt[2].replace(/\./g,'').replace(',','.'));
        if(!isFinite(val)||val<=0)continue;
        if(/SALDO ANTERIOR|PAGTO|PAGAMENTO|^Total|Valor da fatura|Despesas|Resumo|Taxas|M[íi]nimo|Cota[çc][ãa]o|Validade|Vencimento/i.test(desc))continue;
        var parcel=null;var mp=desc.match(/\(\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)/);
        if(mp){parcel={n:+mp[1],total:+mp[2]};desc=desc.replace(mp[0],'').trim();}
        rows.push({day:day,desc:desc,amount:Math.round(val*100)/100,owner:owner,parcel:parcel,include:true});
      }
    }
    return {rows:rows,card:card};
  }
  function doImport(){
    var rows=S.imp.rows.filter(function(r){return r.include;});
    if(!rows.length){toast('Nada selecionado');return;}
    if(!isAdmin()){var mp=myPerson();rows.forEach(function(r){r.owner=mp;});}
    var month=S.imp.month||keyNow();var card=(S.imp.card||'Cartão').trim()||'Cartão';
    var built;
    if(S.imp.group){
      // 1 lançamento por cartão (por pessoa, pois a fatura separa por titular)
      var byOwner={};rows.forEach(function(r){(byOwner[r.owner||'C']=byOwner[r.owner||'C']||[]).push(r);});
      var owners=Object.keys(byOwner);var multi=owners.length>1;
      built=owners.map(function(ow){
        var items=byOwner[ow].map(function(r){var c=C.classify(r.desc,'casa');
          return {desc:r.desc,amount:r.amount,day:r.day||0,owner:ow,cat:c.cat,icon:c.icon,parcel:r.parcel};});
        var total=items.reduce(function(a,it){return a+it.amount;},0);
        var nm='Cartão '+card+(multi&&C.PEOPLE[ow]?(' · '+C.PEOPLE[ow].name):'');
        return {key:month,entry:{id:C.uid(),name:nm,kind:'out',amount:Math.round(total*100)/100,day:0,
          owner:ow,group:'casa',cat:'Cartões',icon:'card',paid:false,method:card,repeat:'none',parcel:null,items:items}};});
      commit(C.withEntries(S.store,built));
      toast(built.length===1?'Cartão importado':built.length+' cartões importados');
    }else{
      built=rows.map(function(r){var c=C.classify(r.desc,'casa');
        return {key:month,entry:{id:C.uid(),name:r.desc+(r.parcel?(' ('+r.parcel.n+'/'+r.parcel.total+')'):''),
          kind:'out',amount:r.amount,day:r.day||0,owner:r.owner||'C',group:'casa',cat:c.cat,icon:c.icon,paid:false,
          method:card,repeat:'none',parcel:r.parcel}};});
      commit(C.withEntries(S.store,built));
      toast(built.length+' lançamentos importados');
    }
    S.imp.open=false;render();
  }

  function removeItem(key,entryId,idx){
    var list=S.store.entries[key]||[];var e=list.filter(function(x){return x.id===entryId;})[0];
    if(!e||!e.items)return;var items=e.items.slice();items.splice(idx,1);
    if(!items.length){commit(C.removeEntry(S.store,key,entryId));toast('Cartão removido');}

  function dueBanner(){
    if(S.y!==REAL.y||S.m!==REAL.m)return '';
    var list=(S.store.entries[keyNow()]||[]).filter(function(e){return e.kind==='out'&&!e.paid&&e.day>0;});
    if(S.owner!=='all')list=list.filter(function(e){return e.owner===S.owner;});
    var over=list.filter(function(e){return e.day<REAL.d;}).sort(function(a,b){return a.day-b.day;});
    var soon=list.filter(function(e){return e.day>=REAL.d&&e.day<=REAL.d+5;}).sort(function(a,b){return a.day-b.day;});
    if(!over.length&&!soon.length)return '';
    function chips(arr,cls){return arr.slice(0,4).map(function(e){return '<span class="duechip '+cls+'">dia '+C.pad(e.day)+' · '+esc(e.name)+' · '+esc(C.brl(e.amount,{cents:false}))+'</span>';}).join('')+(arr.length>4?'<span class="duechip">+'+(arr.length-4)+'</span>':'');}
    var h='<div class="banner">';
    if(over.length)h+='<div class="bline"><b style="color:var(--neg)">⚠ Vencidas · '+over.length+' · '+esc(C.brl(over.reduce(function(a,e){return a+e.amount;},0),{cents:false}))+'</b>'+chips(over,'bad')+'</div>';
    if(soon.length)h+='<div class="bline"><b style="color:var(--warn)">⏰ Vence em até 5 dias · '+soon.length+' · '+esc(C.brl(soon.reduce(function(a,e){return a+e.amount;},0),{cents:false}))+'</b>'+chips(soon,'warn')+'</div>';
    return h+'</div>';
  }
  function objView(o,leftover){
    var target=+o.target||0,saved=+o.saved||0,monthly=+o.monthly||0;
    var faltam=Math.max(0,target-saved);var pct=target>0?Math.min(100,Math.round(saved/target*100)):0;
    var done=target>0&&saved>=target;var meses=monthly>0?Math.ceil(faltam/monthly):null;
    var mesesPrazo=null,atrasado=false;
    if(o.deadline&&/^\d{4}-\d{2}$/.test(o.deadline)){var p=o.deadline.split('-');var dl=(+p[0])*12+((+p[1])-1);var cur=S.y*12+(S.m-1);mesesPrazo=Math.max(0,dl-cur);if(!done&&meses!=null&&meses>mesesPrazo)atrasado=true;}
    return {target:target,saved:saved,monthly:monthly,faltam:faltam,pct:pct,done:done,meses:meses,mesesPrazo:mesesPrazo,atrasado:atrasado,cobre:leftover>=monthly};
  }

  function resultText(){var f=S.form;var a=C.parseMoney(f.value);
    var chosen=f.cat&&f.cat.trim();
    var cat=chosen?f.cat.trim():(f.desc.trim()?C.classify(f.desc,f.group).cat:'—');
    var catLbl=(chosen?'Categoria · ':'Categoria sugerida · ')+cat;
    if(!f.desc.trim()||!isFinite(a)||a<=0)return catLbl;
    if(S.editingId)return 'Categoria · '+cat;
    if(f.repeat==='parcelado'){var n=Math.max(2,Math.min(60,parseInt(f.parcels,10)||2));return n+'× de '+C.brl(a/n)+' · '+cat;}
    if(f.repeat==='fixo'){var m=Math.max(1,Math.min(60,parseInt(f.months,10)||3));return C.brl(a)+' por '+m+' meses · '+cat;}
    return C.brl(a)+' à vista · '+cat;}

  /* ---------- eventos ---------- */
  function wire(){
    var app=document.getElementById('app');
    hideTip();
    app.onmousemove=function(ev){var el=ev.target&&ev.target.closest?ev.target.closest('[data-tip]'):null;if(el){showTip(el.getAttribute('data-tip'),ev.clientX,ev.clientY);}else hideTip();};
    app.onmouseleave=function(){hideTip();};
    app.oninput=function(ev){var el=ev.target;var fld=el.getAttribute&&el.getAttribute('data-field');
      if(fld){
        if(fld==='gcat')S.goalForm.cat=el.value; else if(fld==='glimit')S.goalForm.limit=el.value;
        else if(fld==='codform')S.codForm=el.value;
        else if(fld==='catnew')S.form.cat=el.value;
        else if(fld==='oname')S.objForm.name=el.value; else if(fld==='otarget')S.objForm.target=el.value;
        else if(fld==='omonthly')S.objForm.monthly=el.value; else if(fld==='odeadline')S.objForm.deadline=el.value;
        else if(fld==='impmonth')S.imp.month=el.value.trim(); else if(fld==='impcard')S.imp.card=el.value;
        else if(fld==='quick')S.quick=el.value;
        else if(fld==='pinatual')S.pinForm.atual=el.value; else if(fld==='pinnova')S.pinForm.nova=el.value;
        else S.form[fld]=el.value;
        if(fld==='value'||fld==='desc'||fld==='parcels'||fld==='months'||fld==='catnew'){var rt=document.querySelector('#formcard .small');if(rt)rt.innerHTML=resultText();}
        return;
      }
      var act=el.getAttribute&&el.getAttribute('data-act');
      if(act==='impdesc'){S.imp.rows[+el.getAttribute('data-i')].desc=el.value;}
      else if(act==='goalrange'){var gi=el.getAttribute('data-i');var gval=+el.value;var gused=+el.getAttribute('data-used');
        var ve=document.getElementById('grval'+gi);if(ve)ve.textContent=C.brl(gval);
        var pc=gval>0?Math.min(100,Math.round(gused/gval*100)):0;var be=document.getElementById('grbar'+gi);if(be)be.style.width=pc+'%';}
    };
    app.onchange=function(ev){var el=ev.target;var act=el.getAttribute&&el.getAttribute('data-act');if(!act)return;
      if(act==='impfile'){handlePdf(el.files&&el.files[0]);}
      else if(act==='imptoggle'){S.imp.rows[+el.getAttribute('data-i')].include=el.checked;render();}
      else if(act==='impall'){var ck=el.checked;S.imp.rows.forEach(function(r){r.include=ck;});render();}
      else if(act==='impowner'){S.imp.rows[+el.getAttribute('data-i')].owner=el.value;}
      else if(act==='impgroup'){S.imp.group=el.checked;render();}
      else if(act==='restorefile'){restoreBackup(el.files&&el.files[0]);}
      else if(act==='goalselect'){if(el.value==='__new__'){S.goalNew=true;S.goalForm.cat='';}else{S.goalNew=false;S.goalForm.cat=el.value;}render();}
      else if(act==='catselect'){if(el.value==='__new__'){S.form.catNew=true;S.form.cat='';}else{S.form.catNew=false;S.form.cat=el.value;}render();}
      else if(act==='goalrange'){commit(C.setGoal(S.store,el.getAttribute('data-cat'),+el.value));}
    };
    app.onclick=function(ev){var el=ev.target.closest&&ev.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');var v=el.getAttribute('data-v');
      switch(act){
        case 'prevm':shift(-1);break; case 'nextm':shift(1);break;
        case 'theme':S.theme=v;try{localStorage.setItem('orc-tema',v);}catch(e){}document.documentElement.setAttribute('data-theme',v);render();break;
        case 'owner':S.owner=v;if(!S.editingId)S.form.owner=defaultOwner();render();break;
        case 'tab':S.tab=v;render();break;
        case 'f-kind':setForm({kind:v});break; case 'f-group':setForm({group:v});break;
        case 'f-owner':setForm({owner:v});break;
        case 'f-repeat':setForm(v==='fixo'?{repeat:v,fixo:true}:{repeat:v});break;
        case 'f-fixo':setForm({fixo:v==='fixo'});break;
        case 'submit':submitForm();break; case 'cancel':resetForm();break;
        case 'edit':startEdit(el.getAttribute('data-key'),el.getAttribute('data-id'));break;
        case 'expand':S.expanded[el.getAttribute('data-id')]=!S.expanded[el.getAttribute('data-id')];render();break;
        case 'catexp':{var cn=el.getAttribute('data-cat');S.catOpen[cn]=!S.catOpen[cn];render();break;}
        case 'catpick':{var cp=el.getAttribute('data-cat');S.catSel=(S.catSel===cp?null:cp);render();break;}
        case 'fvpick':{var fp=el.getAttribute('data-v');S.fvSel=(S.fvSel===fp?null:fp);render();break;}
        case 'newentry':S.tab='lancamentos';resetForm();setTimeout(function(){var el2=document.getElementById('formcard');if(el2)el2.scrollIntoView({behavior:'smooth',block:'start'});},60);break;
        case 'rmitem':removeItem(el.getAttribute('data-key'),el.getAttribute('data-id'),+el.getAttribute('data-idx'));break;
        case 'toggle':commit(C.togglePaid(S.store,el.getAttribute('data-key'),el.getAttribute('data-id')));break;
        case 'togglefix':{var tfk=el.getAttribute('data-key'),tfi=el.getAttribute('data-id');var tfe=(S.store.entries[tfk]||[]).filter(function(x){return x.id===tfi;})[0];if(tfe){var nf=!C.isFixed(tfe);commit(C.updateEntry(S.store,tfk,tfi,{fixo:nf}));toast(nf?'Marcado como fixo':'Marcado como variável');}break;}
        case 'remove':commit(C.removeEntry(S.store,el.getAttribute('data-key'),el.getAttribute('data-id')));toast('Excluído');break;
        case 'copyprev':var p=C.shiftMonth(S.y,S.m,-1);commit(C.copyMonth(S.store,C.keyOf(p.y,p.m),keyNow()));toast('Copiado');break;
        case 'addgoal':{var lim=C.parseMoney(S.goalForm.limit);var cat=S.goalForm.cat.trim();if(!cat||!isFinite(lim)||lim<=0){toast('Escolha a categoria e o teto');break;}commit(C.setGoal(S.store,cat,lim));S.goalForm={cat:'',limit:''};S.goalNew=false;toast('Meta definida');break;}
        case 'delgoal':commit(C.setGoal(S.store,el.getAttribute('data-cat'),0));break;
        case 'savecod':{var cv=(S.codForm||'').trim();if(cv.length<4){toast('O código precisa de ao menos 4 caracteres');break;}saveCodigo(cv);break;}
        case 'editgoal':S.goalForm={cat:el.getAttribute('data-cat'),limit:String(el.getAttribute('data-limit')).replace('.',',')};S.goalNew=false;render();var fc=document.querySelector('[data-act="addgoal"]');if(fc)fc.scrollIntoView({behavior:'smooth',block:'center'});break;
        case 'clearmonth':if(window.confirm('Apagar TODOS os lançamentos de '+C.monthLabel(S.y,S.m)+'?')){commit(C.clearMonth(S.store,keyNow()));toast('Mês limpo');}break;
        case 'addobj':{var t=C.parseMoney(S.objForm.target);var nm=S.objForm.name.trim();if(!nm||!isFinite(t)||t<=0){toast('Preencha objetivo e valor-alvo');break;}var mo=C.parseMoney(S.objForm.monthly);var dl=/^\d{4}-\d{2}$/.test((S.objForm.deadline||'').trim())?S.objForm.deadline.trim():'';commit(C.setObjective(S.store,{id:C.uid(),name:nm,target:Math.round(t*100)/100,monthly:isFinite(mo)&&mo>0?Math.round(mo*100)/100:0,saved:0,deadline:dl}));S.objForm={name:'',target:'',monthly:'',deadline:'',saved:''};toast('Objetivo criado');break;}
        case 'aporte':{var oid=el.getAttribute('data-id');var ob=(S.store.objectives||[]).filter(function(x){return x.id===oid;})[0];if(ob&&(+ob.monthly||0)>0)commit(C.addContribution(S.store,oid,+ob.monthly||0));toast('Guardado');break;}
        case 'aportec':{var oid2=el.getAttribute('data-id');var pv=C.parseMoney(window.prompt('Quanto você guardou neste objetivo?','0,00'));if(isFinite(pv)&&pv>0){commit(C.addContribution(S.store,oid2,pv));toast('Guardado');}break;}
        case 'delobj':commit(C.removeObjective(S.store,el.getAttribute('data-id')));break;
        case 'import':openImport();break; case 'impclose':closeImport();break;
        case 'impbg':if(ev.target===el)closeImport();break;
        case 'impdo':doImport();break;
        case 'quickadd':quickAdd();break;
        case 'applyrec':{var ar=C.applyRecurring(S.store,keyNow(),canWriteOwner);if(ar.added>0){commit(ar.store);toast(ar.added+(ar.added>1?' contas fixas lançadas':' conta fixa lançada'));}else toast('Nada pendente');break;}
        case 'delrec':commit(C.removeRecurring(S.store,el.getAttribute('data-id')));toast('Conta fixa removida');break;
        case 'reserveleft':{var lf=C.summarize(S.store.entries[keyNow()]||[],'all').balance;if(lf>0){commit(C.addReserve(S.store,lf));toast('Guardado na reserva');}else toast('Não há sobra neste mês');break;}
        case 'reserveother':{var rv=C.parseMoney(window.prompt('Quanto adicionar à reserva?','0,00'));if(isFinite(rv)&&rv>0){commit(C.addReserve(S.store,rv));toast('Reserva atualizada');}break;}
        case 'reservereset':if(window.confirm('Zerar a reserva de emergência?'))commit(Object.assign({},S.store,{reserve:0}));break;
        case 'changepin':changePin();break;
        case 'backup':download('orcamento-backup-'+realKey()+'.json',JSON.stringify(S.store,null,2),'application/json');break;
        case 'csvmonth':download('orcamento-'+keyNow()+'.csv','﻿'+C.toCSV(S.store,keyNow()),'text/csv');break;
        case 'csvall':download('orcamento-tudo.csv','﻿'+C.toCSV(S.store,null),'text/csv');break;
      }
    };
    app.onkeydown=function(ev){if(ev.key==='Enter'){var el=ev.target;var fld=el.getAttribute&&el.getAttribute('data-field');if(fld==='quick'){ev.preventDefault();quickAdd();}}};
  }

  if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
  /* PWA: instalar na tela inicial + funcionar offline (modo app) */
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}
</script>
